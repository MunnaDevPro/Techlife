{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 110px;
            font-weight: 800;
            color: #000;
            margin: 0;
            line-height: 1;
            letter-spacing: 1px;
        }
        h2 {
            font-size: 28px;
            font-weight: 600;
            color: #797979;
            margin: 10px 0 5px 0;
        }
        p.corrupted {
            font-size: 20px;
            font-weight: 400;
            color: #bcbcbc;
            margin: 0 0 5px 0;
        }
        p.removed {
            font-size: 13px;
            font-weight: 500;
            color: #555555;
            margin: 0 0 35px 0;
        }
        a.btn {
            display: inline-block;
            background-color: #1e3a6e;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            padding: 12px 28px;
            letter-spacing: 0.5px;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }
        a.btn:hover {
            background-color: #152d56;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 100px; }
            h2 { font-size: 22px; }
            p.corrupted { font-size: 16px; }
            p.removed { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div>
        <h1>404</h1>
        <h2>Oops, This Page Not Found!</h2>
        <p class="corrupted">The link might be corrupted,</p>
        <p class="removed">or the page may have been removed</p>
        <a href="/" class="btn">GO BACK HOME</a>
    </div>
</body>
</html>
