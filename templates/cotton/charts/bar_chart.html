<div class="w-full h-64 relative bg-white border border-gray-200 rounded-md p-4" x-data="{
    initChart() {
        if (window.Chart) {
            new Chart(this.$refs.canvas, {
                type: 'bar',
                data: {
                    labels: {{ labels|safe|default:"['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun']" }},
                    datasets: [{
                        label: '{{ dataset_label|default:"Metrics" }}',
                        data: {{ values|safe|default:"[12, 19, 3, 5, 2, 3]" }},
                        backgroundColor: '#2563eb',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { 
                            grid: { color: '#f3f4f6' },
                            ticks: { font: { size: 11 } }
                        },
                        x: { 
                            grid: { display: false },
                            ticks: { font: { size: 11 } }
                        }
                    }
                }
            });
        }
    }
}" x-init="
    if (!window.Chart) {
        let script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/chart.js';
        script.onload = () => { initChart(); };
        document.head.appendChild(script);
    } else {
        initChart();
    }
">
    <h4 class="text-sm font-semibold text-gray-800 mb-2">{{ title|default:"Activity Overview" }}</h4>
    <div class="h-48">
        <canvas x-ref="canvas"></canvas>
    </div>
</div>
