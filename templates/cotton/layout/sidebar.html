<aside x-data="{
    collapsed: localStorage.getItem('tl_sidebar') === 'collapsed',
    activeSubmenu: '{{ active_menu|default:'' }}',
    toggleMenu(name) {
        if (this.activeSubmenu === name) {
            this.activeSubmenu = '';
        } else {
            this.activeSubmenu = name;
        }
    },
    toggle() {
        this.collapsed = !this.collapsed;
        localStorage.setItem('tl_sidebar', this.collapsed ? 'collapsed' : 'expanded');
        const main = document.getElementById('tl-main');
        if (main) main.classList.toggle('sidebar-collapsed', this.collapsed);
    }
}"
x-init="
    const main = document.getElementById('tl-main');
    if (main) main.classList.toggle('sidebar-collapsed', collapsed);
    $nextTick(() => { if(window.lucide) lucide.createIcons(); });
"
:class="collapsed ? 'ft-sidebar collapsed' : 'ft-sidebar'"
aria-label="Main navigation">

    <!-- Brand -->
    <div class="ft-sidebar-brand">
        <div class="ft-sidebar-logo">
            <i data-lucide="zap" style="width:16px;height:16px;color:white"></i>
        </div>
        <span x-show="!collapsed" x-cloak
              style="font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden">
            TechLife Admin
        </span>
        <button @click="toggle()" x-show="!collapsed" x-cloak type="button"
                class="ft-btn ft-btn-ghost ft-btn-icon"
                style="margin-left:auto;flex-shrink:0"
                title="Collapse sidebar">
            <i data-lucide="panel-left-close" style="width:15px;height:15px"></i>
        </button>
    </div>
    <!-- Expand button when collapsed -->
    <div x-show="collapsed" x-cloak style="padding:8px 6px;border-bottom:1px solid var(--border)">
        <button @click="toggle()" type="button"
                class="ft-nav-item" style="justify-content:center;padding:7px"
                title="Expand sidebar">
            <i data-lucide="panel-left-open" style="width:15px;height:15px"></i>
        </button>
    </div>

    <!-- Navigation -->
    <nav class="ft-sidebar-nav scrollbar-hide">

        <!-- Overview -->
        <a href="{% url 'dashboard:overview' %}"
           class="ft-nav-item {% if active_menu == 'Overview' %}active{% endif %}"
           title="Overview">
            <i data-lucide="layout-dashboard"></i>
            <span x-show="!collapsed" x-cloak>Overview</span>
        </a>

        <!-- Content -->
        <div>
            <button @click="toggleMenu('Content')" type="button"
                    class="ft-nav-item {% if active_menu == 'Content' %}active{% endif %}"
                    title="Content">
                <i data-lucide="file-text"></i>
                <span x-show="!collapsed" x-cloak style="flex:1;text-align:left">Content</span>
                <i x-show="!collapsed" x-cloak data-lucide="chevron-down"
                   style="width:13px;height:13px;transition:transform .22s cubic-bezier(.4,0,.2,1)"
                   :style="activeSubmenu === 'Content' ? 'transform:rotate(180deg)' : ''"></i>
            </button>
            <div x-show="activeSubmenu === 'Content' && !collapsed" x-cloak x-collapse.duration.250ms>
                <a href="{% url 'dashboard:content_posts' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:content_posts' %}active{% endif %}">
                    Posts
                </a>
                <a href="{% url 'dashboard:content_pending' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:content_pending' %}active{% endif %}">
                    Pending Review
                </a>
                <a href="{% url 'dashboard:content_categories' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:content_categories' %}active{% endif %}">
                    Categories
                </a>
                <a href="{% url 'dashboard:content_pending' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:content_pending' %}active{% endif %}">
                    Subcategories
                </a>
            </div>
        </div>

        <!-- Forum -->
        <div>
            <button @click="toggleMenu('Forum')" type="button"
                    class="ft-nav-item {% if active_menu == 'Forum' %}active{% endif %}"
                    title="Forum">
                <i data-lucide="message-square"></i>
                <span x-show="!collapsed" x-cloak style="flex:1;text-align:left">Forum</span>
                <i x-show="!collapsed" x-cloak data-lucide="chevron-down"
                   style="width:13px;height:13px;transition:transform .22s cubic-bezier(.4,0,.2,1)"
                   :style="activeSubmenu === 'Forum' ? 'transform:rotate(180deg)' : ''"></i>
            </button>
            <div x-show="activeSubmenu === 'Forum' && !collapsed" x-cloak x-collapse.duration.250ms>
                <a href="{% url 'dashboard:forum_questions' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:forum_questions' %}active{% endif %}">
                    Questions
                </a>
                <a href="{% url 'dashboard:forum_answers' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:forum_answers' %}active{% endif %}">
                    Answers
                </a>
                <a href="{% url 'dashboard:forum_reported' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:forum_reported' %}active{% endif %}">
                    Reported
                </a>
            </div>
        </div>

        <!-- Moderation -->
        <div>
            <button @click="toggleMenu('Moderation')" type="button"
                    class="ft-nav-item {% if active_menu == 'Moderation' %}active{% endif %}"
                    title="Moderation">
                <i data-lucide="shield"></i>
                <span x-show="!collapsed" x-cloak style="flex:1;text-align:left">Moderation</span>
                <i x-show="!collapsed" x-cloak data-lucide="chevron-down"
                   style="width:13px;height:13px;transition:transform .22s cubic-bezier(.4,0,.2,1)"
                   :style="activeSubmenu === 'Moderation' ? 'transform:rotate(180deg)' : ''"></i>
            </button>
            <div x-show="activeSubmenu === 'Moderation' && !collapsed" x-cloak x-collapse.duration.250ms>
                <a href="{% url 'dashboard:mod_comments' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:mod_comments' %}active{% endif %}">
                    Comment Queue
                </a>
                <a href="{% url 'dashboard:mod_flagged' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:mod_flagged' %}active{% endif %}">
                    Flagged
                </a>
                <a href="{% url 'dashboard:mod_blocked' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:mod_blocked' %}active{% endif %}">
                    Blocked Users
                </a>
            </div>
        </div>

        <!-- Users -->
        <div>
            <button @click="toggleMenu('Users')" type="button"
                    class="ft-nav-item {% if active_menu == 'Users' %}active{% endif %}"
                    title="Users">
                <i data-lucide="users"></i>
                <span x-show="!collapsed" x-cloak style="flex:1;text-align:left">Users</span>
                <i x-show="!collapsed" x-cloak data-lucide="chevron-down"
                   style="width:13px;height:13px;transition:transform .22s cubic-bezier(.4,0,.2,1)"
                   :style="activeSubmenu === 'Users' ? 'transform:rotate(180deg)' : ''"></i>
            </button>
            <div x-show="activeSubmenu === 'Users' && !collapsed" x-cloak x-collapse.duration.250ms>
                <a href="{% url 'dashboard:users_all' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:users_all' %}active{% endif %}">
                    All Users
                </a>
                <a href="{% url 'dashboard:users_verification' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:users_verification' %}active{% endif %}">
                    Verification
                </a>
                <a href="{% url 'dashboard:users_roles' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:users_roles' %}active{% endif %}">
                    Roles
                </a>
            </div>
        </div>

        <!-- SEO -->
        <div>
            <button @click="toggleMenu('SEO')" type="button"
                    class="ft-nav-item {% if active_menu == 'SEO' %}active{% endif %}"
                    title="SEO">
                <i data-lucide="search"></i>
                <span x-show="!collapsed" x-cloak style="flex:1;text-align:left">SEO</span>
                <i x-show="!collapsed" x-cloak data-lucide="chevron-down"
                   style="width:13px;height:13px;transition:transform .22s cubic-bezier(.4,0,.2,1)"
                   :style="activeSubmenu === 'SEO' ? 'transform:rotate(180deg)' : ''"></i>
            </button>
            <div x-show="activeSubmenu === 'SEO' && !collapsed" x-cloak x-collapse.duration.250ms>
                <a href="{% url 'dashboard:seo_audit' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:seo_audit' %}active{% endif %}">
                    Meta Audit
                </a>
                <a href="{% url 'dashboard:seo_sitemap' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:seo_sitemap' %}active{% endif %}">
                    Sitemap
                </a>
                <a href="{% url 'dashboard:seo_broken' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:seo_broken' %}active{% endif %}">
                    404 Logs
                </a>
            </div>
        </div>

        <!-- Analytics -->
        <div>
            <button @click="toggleMenu('Analytics')" type="button"
                    class="ft-nav-item {% if active_menu == 'Analytics' %}active{% endif %}"
                    title="Analytics">
                <i data-lucide="bar-chart-2"></i>
                <span x-show="!collapsed" x-cloak style="flex:1;text-align:left">Analytics</span>
                <i x-show="!collapsed" x-cloak data-lucide="chevron-down"
                   style="width:13px;height:13px;transition:transform .22s cubic-bezier(.4,0,.2,1)"
                   :style="activeSubmenu === 'Analytics' ? 'transform:rotate(180deg)' : ''"></i>
            </button>
            <div x-show="activeSubmenu === 'Analytics' && !collapsed" x-cloak x-collapse.duration.250ms>
                <a href="{% url 'dashboard:analytics_traffic' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:analytics_traffic' %}active{% endif %}">
                    Traffic
                </a>
                <a href="{% url 'dashboard:analytics_posts' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:analytics_posts' %}active{% endif %}">
                    Top Posts
                </a>
                <a href="{% url 'dashboard:analytics_authors' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:analytics_authors' %}active{% endif %}">
                    Author Performance
                </a>
            </div>
        </div>

        <!-- Site Settings -->
        <div>
            <button @click="toggleMenu('Site Settings')" type="button"
                    class="ft-nav-item {% if active_menu == 'Site Settings' %}active{% endif %}"
                    title="Site Settings">
                <i data-lucide="settings"></i>
                <span x-show="!collapsed" x-cloak style="flex:1;text-align:left">Site Settings</span>
                <i x-show="!collapsed" x-cloak data-lucide="chevron-down"
                   style="width:13px;height:13px;transition:transform .22s cubic-bezier(.4,0,.2,1)"
                   :style="activeSubmenu === 'Site Settings' ? 'transform:rotate(180deg)' : ''"></i>
            </button>
            <div x-show="activeSubmenu === 'Site Settings' && !collapsed" x-cloak x-collapse.duration.250ms>
                <a href="{% url 'dashboard:settings_ads' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:settings_ads' %}active{% endif %}">
                    Ads Config
                </a>
                <a href="{% url 'dashboard:settings_footer' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:settings_footer' %}active{% endif %}">
                    Footer / Logos
                </a>
                <a href="{% url 'dashboard:settings_maintenance' %}"
                   class="ft-nav-sub-item {% if active_submenu == 'dashboard:settings_maintenance' %}active{% endif %}">
                    Maintenance
                </a>
            </div>
        </div>

        <!-- Notifications -->
        <a href="{% url 'dashboard:notifications' %}"
           class="ft-nav-item {% if active_menu == 'Notifications' %}active{% endif %}"
           title="Notifications">
            <i data-lucide="bell"></i>
            <span x-show="!collapsed" x-cloak>Notifications</span>
        </a>

    </nav>

    <!-- Sidebar footer -->
    <div style="padding:8px 6px;border-top:1px solid var(--border);flex-shrink:0">
        <a href="/" target="_blank"
           class="ft-nav-item" title="View Site">
            <i data-lucide="external-link" style="opacity:.6"></i>
            <span x-show="!collapsed" x-cloak style="font-size:12px;color:var(--text-muted)">View Site</span>
        </a>
    </div>
</aside>
