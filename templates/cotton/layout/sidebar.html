<aside :class="sidebarOpen ? 'w-64' : 'w-16'" class="flex-shrink-0 bg-white border-r border-gray-200 min-h-screen flex flex-col transition-all duration-300 sticky top-0">
    <!-- Header/Logo area -->
    <div class="h-16 flex items-center justify-between px-4 border-b border-gray-200">
        <a href="{% url 'dashboard:overview' %}" class="flex items-center gap-2 font-bold text-lg text-blue-600 overflow-hidden whitespace-nowrap">
            <i data-lucide="zap" class="w-5 h-5 flex-shrink-0 text-blue-600"></i>
            <span x-show="sidebarOpen" class="transition-opacity duration-300 font-bold text-[16px]">TechLife Admin</span>
        </a>
        <button @click="sidebarOpen = !sidebarOpen" class="p-1 rounded hover:bg-gray-100 text-gray-500">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- Navigation items -->
    <nav class="flex-grow overflow-y-auto px-2 py-4 space-y-1">
        {% for item in sidebar_menu %}
            <div x-data="{ open: {% if active_menu == item.name %}true{% else %}false{% endif %} }" class="space-y-0.5">
                {% if item.sub_items %}
                    <!-- Has sub items -->
                    <button type="button" @click="open = !open" 
                       class="cursor-pointer w-full flex items-center justify-between py-1 px-1.5 rounded-md text-[14px] text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors {% if active_menu == item.name %}font-semibold{% endif %}">
                        <span class="flex items-center gap-2">
                            <i data-lucide="{{ item.icon }}" class="w-4 h-4 text-gray-500"></i>
                            <span x-show="sidebarOpen">{{ item.name }}</span>
                        </span>
                        <i x-show="sidebarOpen" data-lucide="chevron-down" class="w-4 h-4 text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''"></i>
                    </button>
                    
                    <div x-show="open && sidebarOpen" class="pl-4 space-y-0.5 transition-all duration-300">
                        {% for sub in item.sub_items %}
                            <a href="{% url sub.url_name %}" hx-get="{% url sub.url_name %}" hx-target="#main-content" hx-push-url="true"
                               class="cursor-pointer block py-1 px-1.5 rounded-md text-[13px] transition-colors border-l-2 {% if active_submenu == sub.url_name %}bg-blue-50 text-blue-600 border-blue-600 font-medium{% else %}text-gray-600 border-transparent hover:bg-gray-50 hover:text-gray-900{% endif %}">
                               {{ sub.name }}
                            </a>
                        {% endfor %}
                    </div>
                {% else %}
                    <!-- No sub items -->
                    <a href="{% url item.url_name %}" hx-get="{% url item.url_name %}" hx-target="#main-content" hx-push-url="true"
                       class="cursor-pointer flex items-center gap-2 py-1 px-1.5 rounded-md text-[14px] transition-colors border-l-2 {% if active_menu == item.name %}bg-blue-50 text-blue-600 border-blue-600 font-semibold{% else %}text-gray-700 border-transparent hover:bg-gray-50 hover:text-gray-900{% endif %}">
                        <i data-lucide="{{ item.icon }}" class="w-4 h-4 {% if active_menu == item.name %}text-blue-600{% else %}text-gray-500{% endif %}"></i>
                        <span x-show="sidebarOpen">{{ item.name }}</span>
                    </a>
                {% endif %}
            </div>
        {% endfor %}
    </nav>
</aside>
