<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-10">
    <!-- Page Title / Left side -->
    <div class="flex items-center gap-4">
        <h1 class="text-lg font-semibold text-gray-800">{{ page_title }}</h1>
    </div>

    <!-- Search & Profile / Right side -->
    <div class="flex items-center gap-4">
        <!-- Search bar -->
        <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i data-lucide="search" class="h-4 w-4 text-gray-400"></i>
            </span>
            <input type="text" placeholder="Search..." class="pl-9 pr-4 py-1.5 bg-gray-50 border border-gray-200 rounded-md text-[14px] focus:outline-none focus:ring-1 focus:ring-blue-500 focus:bg-white w-64 transition-colors">
        </div>

        <!-- Notification bell placeholder -->
        <button class="p-1.5 rounded-full hover:bg-gray-100 text-gray-500 relative">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="absolute top-1.5 right-1.5 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white"></span>
        </button>

        <!-- Profile dropdown -->
        <div x-data="{ open: false }" class="relative">
            <button @click="open = !open" class="flex items-center gap-2 hover:bg-gray-50 p-1.5 rounded-md transition-colors">
                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center font-semibold text-blue-700 text-[14px]">
                    {{ user.username|slice:":2"|upper }}
                </div>
                <span class="text-[14px] text-gray-700 font-medium hidden md:inline">{{ user.username }}</span>
                <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
            </button>
            <div x-show="open" @click.outside="open = false" class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-md py-1 z-20" style="display: none;">
                <div class="px-4 py-2 border-b border-gray-100">
                    <p class="text-[12px] text-gray-500">Logged in as</p>
                    <p class="text-[14px] font-semibold text-gray-800 truncate">{{ user.email }}</p>
                </div>
                <a href="{% url 'profile_update' %}" class="block px-4 py-2 text-[14px] text-gray-700 hover:bg-gray-50">Profile Settings</a>
                <div class="border-t border-gray-100"></div>
                <a href="{% url 'logout' %}" class="block px-4 py-2 text-[14px] text-red-600 hover:bg-red-50">Sign out</a>
            </div>
        </div>
    </div>
</header>
