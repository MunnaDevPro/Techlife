<header class="ft-topbar">
    <!-- Left: Page title -->
    <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <div style="min-width:0">
            <h1 style="font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                {{ page_title }}
            </h1>
        </div>
    </div>

    <!-- Right: clock + user -->
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">

        <!-- Live date/time -->
        <div style="display:flex;align-items:center;gap:10px;padding:4px 12px;
                    background:var(--surface-2);border:1px solid var(--border);
                    border-radius:var(--radius-sm);font-size:11px;color:var(--text-muted)">
            <span id="tl-date" style="font-weight:600"></span>
            <span style="width:1px;height:14px;background:var(--border)"></span>
            <span id="tl-time" style="font-weight:600;font-family:monospace;letter-spacing:.04em"></span>
        </div>

        <!-- View site -->
        <a href="/" target="_blank"
           class="ft-btn ft-btn-ghost ft-btn-icon" title="View site">
            <i data-lucide="external-link" style="width:15px;height:15px"></i>
        </a>

        <!-- User dropdown -->
        <div x-data="{ open: false }" style="position:relative">
            <button @click="open = !open" type="button"
                    style="display:flex;align-items:center;gap:8px;padding:4px 8px;
                           border-radius:var(--radius-sm);border:none;cursor:pointer;
                           background:transparent;transition:background .15s"
                    onmouseenter="this.style.background='var(--surface-2)'"
                    onmouseleave="this.style.background='transparent'">
                <div style="width:30px;height:30px;border-radius:50%;background:var(--primary);
                             display:flex;align-items:center;justify-content:center;
                             color:white;font-size:12px;font-weight:700;flex-shrink:0">
                    {{ request.user.email|default:"U"|make_list|first|upper }}
                </div>
                <div style="text-align:left;display:none" class="md-show">
                    <p style="font-size:12px;font-weight:600;color:var(--text);
                               max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                        {{ request.user.get_full_name|default:request.user.email|truncatechars:18 }}
                    </p>
                    <p style="font-size:10px;color:var(--text-muted)">Administrator</p>
                </div>
                <i data-lucide="chevron-down" style="width:13px;height:13px;color:var(--text-muted)"></i>
            </button>

            <div x-show="open" @click.away="open = false" x-cloak
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 class="ft-dropdown"
                 style="position:absolute;right:0;top:calc(100% + 6px);min-width:200px">
                <div style="padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:4px">
                    <p style="font-size:12px;font-weight:600;color:var(--text);
                               overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                        {{ request.user.email|default:"User" }}
                    </p>
                    <p style="font-size:10px;color:var(--text-muted)">Staff Administrator</p>
                </div>
                <a href="{% url 'profile_update' %}" class="ft-dropdown-item">
                    <i data-lucide="user" style="width:13px;height:13px"></i>
                    Profile Settings
                </a>
                <div style="height:1px;background:var(--border);margin:4px 0"></div>
                <a href="{% url 'logout' %}" class="ft-dropdown-item"
                   style="color:var(--danger)">
                    <i data-lucide="log-out" style="width:13px;height:13px"></i>
                    Sign out
                </a>
            </div>
        </div>
    </div>
</header>

<script>
(function() {
    function updateClock() {
        var now = new Date();
        var d = document.getElementById('tl-date');
        var t = document.getElementById('tl-time');
        if (d) d.textContent = now.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
        if (t) t.textContent = now.toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
    }
    updateClock();
    setInterval(updateClock, 1000);
})();
</script>
