<div class="min-h-screen flex" x-data="{ sidebarOpen: true }">
    <!-- Sidebar component -->
    <c-layout.sidebar :active_menu="active_menu" :active_submenu="active_submenu" />

    <!-- Main Content wrapper -->
    <div class="flex-1 flex flex-col min-w-0 transition-all duration-300">
        <!-- Top bar component -->
        <c-layout.topbar :page_title="page_title" />

        <!-- Main slot -->
        <main class="flex-grow p-6">
            {{ slot }}
        </main>
    </div>
</div>
