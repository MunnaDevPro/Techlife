<div class="space-y-1">
    {% if label %}
        <label for="{{ id }}" class="block text-[12px] font-medium text-gray-700">{{ label }}</label>
    {% endif %}
    <textarea id="{{ id }}" 
              name="{{ name }}" 
              placeholder="{{ placeholder }}"
              rows="{{ rows|default:3 }}"
              {% if required %}required{% endif %}
              class="w-full px-3 py-1.5 bg-white border border-gray-200 rounded-md text-[14px] focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors {{ extra_class }}">{{ value }}</textarea>
    {% if help_text %}
        <p class="text-[12px] text-gray-500">{{ help_text }}</p>
    {% endif %}
</div>
