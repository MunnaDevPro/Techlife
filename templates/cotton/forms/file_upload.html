<div class="space-y-1">
    {% if label %}
        <label for="{{ id }}" class="block text-[12px] font-medium text-gray-700">{{ label }}</label>
    {% endif %}
    <div class="flex items-center justify-center w-full">
        <label class="flex flex-col items-center justify-center w-full h-32 border border-gray-200 border-dashed rounded-md cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                <i data-lucide="upload-cloud" class="w-8 h-8 text-gray-400 mb-2"></i>
                <p class="text-[14px] text-gray-500 font-semibold">Click to upload or drag & drop</p>
                <p class="text-[12px] text-gray-400 mt-1">PNG, JPG or PDF (MAX. 5MB)</p>
            </div>
            <input type="file" id="{{ id }}" name="{{ name }}" class="hidden" {% if required %}required{% endif %} />
        </label>
    </div>
    {% if help_text %}
        <p class="text-[12px] text-gray-500">{{ help_text }}</p>
    {% endif %}
</div>
