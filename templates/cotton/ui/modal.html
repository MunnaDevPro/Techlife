{% comment %}
c-ui.modal
Props: open (default 'false'), title, footer, extra_class
Slot: modal body content
{% endcomment %}
<div x-data="{ open: {{ open|default:'false' }} }"
     x-show="open" x-cloak x-transition.opacity
     class="ft-modal-backdrop">
    <div class="ft-modal {{ extra_class }}" @click.stop>
        {% if title %}
        <div class="ft-card-header">
            <span class="ft-card-title">{{ title }}</span>
            <button @click="open = false" type="button" class="ft-btn ft-btn-ghost ft-btn-icon ft-btn-sm">
                <i data-lucide="x" style="width:14px;height:14px"></i>
            </button>
        </div>
        {% endif %}
        <div class="ft-card-body">
            {{ slot }}
        </div>
        {% if footer %}
        <div style="padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-2)">
            {{ footer }}
        </div>
        {% endif %}
    </div>
</div>
