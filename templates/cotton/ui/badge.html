{% comment %}
c-ui.badge
Props: variant (success|danger|warning|info|primary|neutral), type (alias for variant), dot, extra_class
Slot: badge text
{% endcomment %}
{% with v=variant|default:type|default:'neutral' %}
<span class="ft-badge ft-badge-{{ v }} {{ extra_class }}">
    {% if dot %}
    <span style="display:inline-block;width:6px;height:6px;border-radius:50%;
                 background:{% if v == 'success' %}#10b981{% elif v == 'danger' %}#ef4444{% elif v == 'warning' %}#f59e0b{% elif v == 'info' %}#3b82f6{% elif v == 'primary' %}#6366f1{% else %}#9ca3af{% endif %}">
    </span>
    {% endif %}
    {{ slot }}
</span>
{% endwith %}
