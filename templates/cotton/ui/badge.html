<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[12px] font-medium 
    {% if type == 'success' %}bg-green-50 text-green-700 border border-green-200
    {% elif type == 'danger' %}bg-red-50 text-red-700 border border-red-200
    {% elif type == 'warning' %}bg-yellow-50 text-yellow-700 border border-yellow-200
    {% elif type == 'info' %}bg-blue-50 text-blue-700 border border-blue-200
    {% else %}bg-gray-50 text-gray-700 border border-gray-200{% endif %} {{ extra_class }}">
    {{ slot }}
</span>
