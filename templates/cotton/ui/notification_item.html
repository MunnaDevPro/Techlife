{% comment %} c-ui.notification_item component
   Props:
   - notification: the notification object
{% endcomment %}

<div class="!relative !block !p-4 hover:!bg-gray-50 !transition-colors !group !border-b !border-gray-100 last:!border-b-0">
    <div class="!flex !items-start !gap-4">
        <div class="!flex-shrink-0 !mt-1 !flex !items-center !gap-4">
            <input type="checkbox" name="notification_ids" value="{{ notification.id }}" class="!w-4 !h-4 !text-blue-600 !bg-gray-100 !border-gray-300 !rounded focus:!ring-blue-500 !cursor-pointer">
            <div class="!w-10 !h-10 !rounded-full !bg-blue-50 !flex !items-center !justify-center group-hover:!bg-blue-100 !transition-colors">
                <i data-lucide="bell-ring" class="!w-5 !h-5 !text-blue-600"></i>
            </div>
        </div>
        
        <div class="!flex-1 !min-w-0" onclick="window.location='{{ notification.target_url|default:'#' }}'" style="cursor: pointer;">
            <div class="!flex !justify-between !items-start">
                <p class="!text-sm !font-semibold !text-gray-900 !mb-1">
                    {{ notification.title }}
                </p>
            </div>
            <p class="!text-sm !text-gray-600 !mb-2 !leading-relaxed">
                {{ notification.message }}
            </p>
            <p class="!text-xs !font-medium !text-gray-400 !flex !items-center !gap-1.5">
                <i data-lucide="clock" class="!w-3.5 !h-3.5"></i>
                {{ notification.created_at|timesince }} ago
            </p>
        </div>
        
        <div class="!flex-shrink-0 !pt-2" onclick="window.location='{{ notification.target_url|default:'#' }}'" style="cursor: pointer;">
            <i data-lucide="chevron-right" class="!w-5 !h-5 !text-gray-300 group-hover:!text-blue-500 !transition-colors"></i>
        </div>
    </div>
</div>
