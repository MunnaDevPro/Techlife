<div class="text-center py-12 px-4 border border-dashed border-gray-300 rounded-md bg-white">
    {% if icon %}
        <div class="mx-auto w-12 h-12 bg-gray-50 flex items-center justify-center text-gray-400 rounded-full mb-3">
            <i data-lucide="{{ icon }}" class="w-6 h-6"></i>
        </div>
    {% endif %}
    <h3 class="text-sm font-semibold text-gray-900">{{ title|default:"No data available" }}</h3>
    <p class="mt-1 text-[12px] text-gray-500 max-w-sm mx-auto">{{ description|default:"Get started by creating a new entry." }}</p>
    {% if action %}
        <div class="mt-4">
            {{ action }}
        </div>
    {% endif %}
</div>
