{% comment %}
c-ui.empty_state
Props: icon, title, description, action
{% endcomment %}
<div style="text-align:center;padding:48px 24px">
    {% if icon %}
    <div style="width:48px;height:48px;margin:0 auto 14px;background:var(--surface-3);
                border-radius:50%;display:flex;align-items:center;justify-content:center">
        <i data-lucide="{{ icon }}" style="width:22px;height:22px;color:var(--text-disabled)"></i>
    </div>
    {% endif %}
    <p style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px">
        {{ title|default:"No data available" }}
    </p>
    <p style="font-size:12px;color:var(--text-muted);max-width:300px;margin:0 auto">
        {{ description|default:"Get started by creating a new entry." }}
    </p>
    {% if action %}
    <div style="margin-top:16px">{{ action }}</div>
    {% endif %}
</div>
