<button type="{{ type|default:'button' }}" 
    {% if hx_get %}hx-get="{{ hx_get }}"{% endif %} 
    {% if hx_post %}hx-post="{{ hx_post }}"{% endif %}
    {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
    class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-md text-[14px] font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500
    {% if variant == 'primary' %}bg-blue-600 hover:bg-blue-700 text-white
    {% elif variant == 'secondary' %}bg-white border border-gray-300 hover:bg-gray-50 text-gray-700
    {% elif variant == 'danger' %}bg-red-600 hover:bg-red-700 text-white
    {% else %}bg-gray-100 hover:bg-gray-200 text-gray-800{% endif %} {{ extra_class }}">
    {% if icon %}
        <i data-lucide="{{ icon }}" class="w-4 h-4"></i>
    {% endif %}
    {{ slot }}
</button>
