{% comment %}
c-ui.button
Props: variant (primary|secondary|ghost|danger|success), size (sm|md|lg),
       type, icon, href, extra_class, hx_get, hx_post, hx_target
Slot: button label text
{% endcomment %}
{% if href %}
<a href="{{ href }}"
   class="ft-btn ft-btn-{{ variant|default:'primary' }} {% if size == 'sm' %}ft-btn-sm{% elif size == 'lg' %}ft-btn-lg{% endif %} {{ extra_class }}">
    {% if icon %}<i data-lucide="{{ icon }}"></i>{% endif %}
    {{ slot }}
</a>
{% else %}
<button type="{{ type|default:'button' }}"
        {% if hx_get %}hx-get="{{ hx_get }}"{% endif %}
        {% if hx_post %}hx-post="{{ hx_post }}"{% endif %}
        {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
        {% if hx_push_url %}hx-push-url="{{ hx_push_url }}"{% endif %}
        {% if disabled %}disabled{% endif %}
        class="ft-btn ft-btn-{{ variant|default:'primary' }} {% if size == 'sm' %}ft-btn-sm{% elif size == 'lg' %}ft-btn-lg{% endif %} {% if full %}ft-btn-full{% endif %} {{ extra_class }}">
    {% if icon %}<i data-lucide="{{ icon }}"></i>{% endif %}
    {{ slot }}
</button>
{% endif %}
