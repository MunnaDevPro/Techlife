{% comment %}
c-ui.table
Props: :headers (list), extra_class
Slot: <tr> rows
{% endcomment %}
<div class="ft-table-wrap {{ extra_class }}">
    <table class="ft-table">
        {% if headers %}
        <thead>
            <tr>
                {% for h in headers %}
                    <th>{{ h }}</th>
                {% endfor %}
            </tr>
        </thead>
        {% endif %}
        <tbody>
            {{ slot }}
        </tbody>
    </table>
</div>
