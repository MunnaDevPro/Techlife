<!-- Sidebar -->
<aside id="sidebar"
    class="hidden-mobile bg-white border-r border-gray-200 w-56 h-screen sticky top-0 flex-shrink-0 transition-all duration-300 ease-in-out z-30 flex flex-col">
    <!-- Header Area -->
    <div class="h-16 flex items-center justify-between px-4 border-b border-gray-100 flex-shrink-0 bg-white">
        <div class="flex items-center gap-2.5 sidebar-text overflow-hidden transition-all duration-300">
            <div
                class="w-8 h-8 rounded-lg bg-[#1e3a6e] flex items-center justify-center text-white shadow-sm flex-shrink-0">
                <i class="fas fa-chart-pie text-[13px]"></i>
            </div>
            <span class="text-[15px] font-extrabold text-gray-800 tracking-tight whitespace-nowrap">Dashboard</span>
        </div>

        <!-- Mobile: ✕ close button, Desktop: ☰ toggle button -->
        <button id="mobile-menu-btn"
            class="text-gray-400 transition-colors focus:outline-none p-2 rounded-lg flex items-center justify-center flex-shrink-0 ml-auto cursor-pointer w-9 h-9 hover:bg-blue-50 hover:text-[#1e3a6e]">
            <i class="fas fa-times sidebar-close-icon" style="font-size: 20px;"></i>
            <i class="fas fa-bars sidebar-menu-icon" style="font-size: 15px;"></i>
        </button>
    </div>

    <!-- Navigation Links -->
    <nav hx-boost="true" hx-push-url="true" hx-target="body" hx-swap="outerHTML transition:true"
        class="flex-1 px-3 py-3 space-y-1 overflow-y-auto scrollbar-hide flex flex-col">
        
        <!-- Overview -->
        <a href="{% url 'user_dashboard' %}?section=overview" hx-boost="false"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if section == 'overview' or not section %}bg-[#1e3a6e] text-white font-semibold shadow-sm{% else %}text-gray-600 font-medium hover:bg-blue-50/60 hover:text-[#1e3a6e]{% endif %} transition-all group"
            title="Overview">
            <i class="fas fa-home w-4 text-center text-[15px] flex-shrink-0 {% if section == 'overview' or not section %}text-white{% else %}group-hover:text-[#1e3a6e]{% endif %}"></i>
            <span class="text-[13px] sidebar-text whitespace-nowrap overflow-hidden transition-all duration-300">Overview</span>
        </a>
        
        <!-- My Company -->
        <a href="{% url 'user_dashboard' %}?section=companies" hx-boost="false"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if section == 'companies' or section == 'edit-company' %}bg-[#1e3a6e] text-white font-semibold shadow-sm{% else %}text-gray-600 font-medium hover:bg-blue-50/60 hover:text-[#1e3a6e]{% endif %} transition-all group"
            title="My Company">
            <i class="fas fa-building w-4 text-center text-[15px] flex-shrink-0 {% if section == 'companies' or section == 'edit-company' %}text-white{% else %}group-hover:text-[#1e3a6e]{% endif %}"></i>
            <span class="text-[13px] sidebar-text whitespace-nowrap overflow-hidden transition-all duration-300">My Company</span>
        </a>
        
        <!-- Blog Posts -->
        <a href="{% url 'user_dashboard' %}?section=blog-posts" hx-boost="false"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if section == 'blog-posts' %}bg-[#1e3a6e] text-white font-semibold shadow-sm{% else %}text-gray-600 font-medium hover:bg-blue-50/60 hover:text-[#1e3a6e]{% endif %} transition-all group"
            title="Blog Posts">
            <i class="fas fa-newspaper w-4 text-center text-[15px] flex-shrink-0 {% if section == 'blog-posts' %}text-white{% else %}group-hover:text-[#1e3a6e]{% endif %}"></i>
            <span class="text-[13px] sidebar-text whitespace-nowrap overflow-hidden transition-all duration-300">Blog Posts</span>
        </a>

        <!-- Recent Activities -->
        <a href="{% url 'user_dashboard' %}?section=activities" hx-boost="false"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if section == 'activities' %}bg-[#1e3a6e] text-white font-semibold shadow-sm{% else %}text-gray-600 font-medium hover:bg-blue-50/60 hover:text-[#1e3a6e]{% endif %} transition-all group"
            title="Recent Activities">
            <i class="fas fa-chart-line w-4 text-center text-[15px] flex-shrink-0 {% if section == 'activities' %}text-white{% else %}group-hover:text-[#1e3a6e]{% endif %}"></i>
            <span class="text-[13px] sidebar-text whitespace-nowrap overflow-hidden transition-all duration-300">Recent Activities</span>
        </a>

        <!-- Questions -->
        <a href="{% url 'user_dashboard' %}?section=questions" hx-boost="false"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if section == 'questions' %}bg-[#1e3a6e] text-white font-semibold shadow-sm{% else %}text-gray-600 font-medium hover:bg-blue-50/60 hover:text-[#1e3a6e]{% endif %} transition-all group"
            title="Questions">
            <i class="fas fa-question-circle w-4 text-center text-[15px] flex-shrink-0 {% if section == 'questions' %}text-white{% else %}group-hover:text-[#1e3a6e]{% endif %}"></i>
            <span class="text-[13px] sidebar-text whitespace-nowrap overflow-hidden transition-all duration-300">Questions</span>
        </a>

        <!-- Notifications -->
        <a href="{% url 'user_dashboard' %}?section=notifications" hx-boost="false"
            class="flex items-center justify-between px-3 py-2.5 rounded-lg {% if section == 'notifications' %}bg-[#1e3a6e] text-white font-semibold shadow-sm{% else %}text-gray-600 font-medium hover:bg-blue-50/60 hover:text-[#1e3a6e]{% endif %} transition-all group"
            title="Notifications">
            <div class="flex items-center gap-3">
                <i class="fas fa-bell w-4 text-center text-[15px] flex-shrink-0 {% if section == 'notifications' %}text-white{% else %}group-hover:text-[#1e3a6e]{% endif %}"></i>
                <span class="text-[13px] sidebar-text whitespace-nowrap overflow-hidden transition-all duration-300">Notifications</span>
            </div>
            {% if unread_notifications_count > 0 and section != 'notifications' %}
            <span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full min-w-[20px] text-center">
                {{ unread_notifications_count }}
            </span>
            {% endif %}
        </a>

        <!-- API Tokens -->
        <a href="{% url 'user_api_tokens' %}" hx-boost="false"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if action == 'api_tokens' or section == 'api-tokens' %}bg-[#1e3a6e] text-white font-semibold shadow-sm{% else %}text-gray-600 font-medium hover:bg-blue-50/60 hover:text-[#1e3a6e]{% endif %} transition-all group"
            title="API Tokens">
            <i class="fas fa-key w-4 text-center text-[15px] flex-shrink-0 {% if action == 'api_tokens' or section == 'api-tokens' %}text-white{% else %}group-hover:text-[#1e3a6e]{% endif %}"></i>
            <span class="text-[13px] sidebar-text whitespace-nowrap overflow-hidden transition-all duration-300">API Tokens</span>
        </a>

        <!-- Create Post (Token) -->
        <a href="{% url 'user_dashboard' %}?section=submit-token-post" hx-boost="false"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if section == 'submit-token-post' %}bg-[#1e3a6e] text-white font-semibold shadow-sm{% else %}text-gray-600 font-medium hover:bg-blue-50/60 hover:text-[#1e3a6e]{% endif %} transition-all group"
            title="Create Post (Token)">
            <i class="fas fa-edit w-4 text-center text-[15px] flex-shrink-0 {% if section == 'submit-token-post' %}text-white{% else %}group-hover:text-[#1e3a6e]{% endif %}"></i>
            <span class="text-[13px] sidebar-text whitespace-nowrap overflow-hidden transition-all duration-300">Create Post (Token)</span>
        </a>

        <!-- Edit Profile -->
        <a href="{% url 'user_dashboard' %}?section=edit-profile" hx-boost="false"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if section == 'edit-profile' %}bg-[#1e3a6e] text-white font-semibold shadow-sm{% else %}text-gray-600 font-medium hover:bg-blue-50/60 hover:text-[#1e3a6e]{% endif %} transition-all group"
            title="Edit Profile">
            <i class="fas fa-user-edit w-4 text-center text-[15px] flex-shrink-0 {% if section == 'edit-profile' %}text-white{% else %}group-hover:text-[#1e3a6e]{% endif %}"></i>
            <span class="text-[13px] sidebar-text whitespace-nowrap overflow-hidden transition-all duration-300">Edit Profile</span>
        </a>

        <div class="my-3 border-t border-gray-100 flex-shrink-0"></div>

        <!-- Push logout to bottom -->
        <div class="mt-auto pt-3 border-t border-gray-100 flex-shrink-0">
            <a href="{% url 'logout' %}" hx-boost="false"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-red-600 font-medium transition-colors hover:bg-red-50 group"
                title="Logout">
                <i class="fas fa-sign-out-alt w-4 text-center text-[15px] flex-shrink-0 group-hover:text-red-700"></i>
                <span class="text-[13px] sidebar-text whitespace-nowrap overflow-hidden transition-all duration-300">Logout</span>
            </a>
        </div>
    </nav>
</aside>

<style>
    /* Sidebar Icons visibility */
    .sidebar-close-icon {
        display: inline-block;
    }

    .sidebar-menu-icon {
        display: none;
    }

    /* Collapsed state for Desktop */
    @media (min-width: 768px) {
        .sidebar-close-icon {
            display: none !important;
        }

        .sidebar-menu-icon {
            display: inline-block !important;
        }
    }

    aside#sidebar.collapsed {
        width: 64px;
    }

    aside#sidebar.collapsed .sidebar-text {
        opacity: 0;
        width: 0;
        margin-left: 0;
        pointer-events: none;
    }

    /* Hide scrollbar for clean look */
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }

    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    /* Mobile hidden state */
    @media (max-width: 768px) {
        aside#sidebar.hidden-mobile {
            transform: translateX(-100%);
            margin-right: -100%;
            width: 0;
            opacity: 0;
            border-right-width: 0;
        }

        aside#sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            z-index: 50;
            transform: translateX(0);
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
        }
    }
</style>
