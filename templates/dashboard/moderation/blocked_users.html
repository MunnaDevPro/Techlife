{% extends base_template %}

{% block content %}
<div style="display:flex;flex-direction:column;gap:20px">
    <div>
        <h2 class="ft-page-title">Blocked Users</h2>
        <p class="ft-page-subtitle">Deactivated or banned accounts</p>
    </div>

    <c-ui.card title="Blocked Accounts" subtitle="{{ users|length }} blocked">
        <c-ui.table :headers="['Email', 'Name', 'Date Joined', 'Status', 'Actions']">
            {% for u in users %}
            <tr>
                <td>{{ u.email }}</td>
                <td style="color:var(--text-muted)">{{ u.first_name }} {{ u.last_name }}</td>
                <td style="color:var(--text-muted);font-size:12px">{{ u.date_joined|date:"Y-m-d H:i" }}</td>
                <td><c-ui.badge variant="danger" dot="true">Blocked</c-ui.badge></td>
                <td>
                    <form action="{% url 'dashboard:user_unblock' u.pk %}" method="post"
                          onsubmit="return confirm('Unblock this user?')">
                        {% csrf_token %}
                        <button type="submit" class="ft-btn ft-btn-success ft-btn-sm">
                            <i data-lucide="user-check"></i> Unblock
                        </button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" style="text-align:center;padding:32px;color:var(--text-muted)">
                    <i data-lucide="shield-check" style="width:28px;height:28px;margin:0 auto 8px;display:block;opacity:.4"></i>
                    No blocked users
                </td>
            </tr>
            {% endfor %}
        </c-ui.table>
    </c-ui.card>
</div>
{% endblock %}
