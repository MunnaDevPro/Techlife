{% extends base_template %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div>
        <h2 class="text-lg font-bold text-gray-800">Blocked Users</h2>
        <p class="text-[12px] text-gray-500">Deactivated or banned accounts</p>
    </div>

    <!-- Table or Empty State -->
    <c-ui.card>
        <c-ui.table :headers="['Email', 'Name', 'Date Joined', 'Status', 'Actions']">
            {% for u in users %}
                <tr>
                    <td class="px-6 py-4 font-medium text-gray-900">{{ u.email }}</td>
                    <td class="px-6 py-4 text-gray-700">{{ u.first_name }} {{ u.last_name }}</td>
                    <td class="px-6 py-4 text-gray-500 text-[12px]">{{ u.date_joined|date:"Y-m-d H:i" }}</td>
                    <td class="px-6 py-4">
                        <c-ui.badge type="danger">Blocked</c-ui.badge>
                    </td>
                    <td class="px-6 py-4">
                        <form action="{% url 'dashboard:user_unblock' u.pk %}" method="post" onsubmit="return confirm('Unblock this user?');">
                            {% csrf_token %}
                            <button type="submit" class="px-3 py-1 bg-green-50 hover:bg-green-100 border border-green-200 text-green-700 rounded text-[13px] font-semibold transition-colors">
                                Unblock
                            </button>
                        </form>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="5" class="px-6 py-4 text-center text-gray-500">No blocked users found.</td>
                </tr>
            {% endfor %}
        </c-ui.table>
    </c-ui.card>
</div>
{% endblock %}
