{% extends base_template %}

{% block content %}
<div class="flex flex-col gap-5">
    <div>
        <h2 class="ft-page-title">Blocked Users</h2>
        <p class="ft-page-subtitle">Deactivated or banned accounts</p>
    </div>

    <c-ui.card title="Blocked Accounts" subtitle="{{ users|length }} blocked">
        <c-ui.table :headers="['Email', 'Name', 'Date Joined', 'Status', 'Actions']">
            {% for u in users %}
            <tr>
                <td>{{ u.email }}</td>
                <td style="color:var(--text-muted)">{{ u.first_name }} {{ u.last_name }}</td>
                <td class="text-[12px]" style="color:var(--text-muted)">{{ u.date_joined|date:"Y-m-d H:i" }}</td>
                <td><c-ui.badge variant="danger" dot="true">Blocked</c-ui.badge></td>
                <td>
                    <form action="{% url 'dashboard:user_unblock' u.pk %}" method="post"
                          onsubmit="return confirm('Unblock this user?')" class="inline">
                        {% csrf_token %}
                        <c-ui.button type="submit" variant="accent" size="sm" icon="user-check" label="Unblock"></c-ui.button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center py-8" style="color:var(--text-muted)">
                    <i data-lucide="shield-check" class="w-7 h-7 mx-auto mb-2 block opacity-40"></i>
                    No blocked users
                </td>
            </tr>
            {% endfor %}
        </c-ui.table>
    </c-ui.card>
</div>
{% endblock %}
