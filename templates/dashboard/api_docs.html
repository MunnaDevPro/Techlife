{% extends base_template %}

{% block content %}
<script id="api-endpoints-json" type="application/json">{{ endpoints_json|safe }}</script>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('apiDocsManager', () => ({
        endpoints: [],
        selectedId: 'posts_like',
        filterCategory: 'All',
        filterMethod: 'All',
        searchQuery: '',
        codeTabs: {},
        sandboxState: {},
        copiedNotice: '',

        init() {
            try {
                const raw = document.getElementById('api-endpoints-json').textContent;
                this.endpoints = JSON.parse(raw);
                if (this.endpoints.length > 0) {
                    this.selectedId = this.endpoints[0].id;
                    this.endpoints.forEach(ep => {
                        this.codeTabs[ep.id] = 'curl';
                        this.sandboxState[ep.id] = {
                            method: ep.method || 'GET',
                            path: ep.path || '',
                            headers: JSON.stringify(ep.headers || {}, null, 2),
                            body: ep.sample_request ? JSON.stringify(ep.sample_request, null, 2) : '',
                            query: '',
                            loading: false,
                            result: null
                        };
                    });
                }
            } catch (e) {
                console.error('Failed to parse API endpoints JSON:', e);
            }
        },

        get filteredEndpoints() {
            return this.endpoints.filter(e => {
                const matchesCat = this.filterCategory === 'All' || e.category === this.filterCategory;
                const matchesMethod = this.filterMethod === 'All' || e.method === this.filterMethod;
                const matchesSearch = !this.searchQuery || 
                    e.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                    e.path.toLowerCase().includes(this.searchQuery.toLowerCase());
                return matchesCat && matchesMethod && matchesSearch;
            });
        },

        toggleEndpoint(id) {
            this.selectedId = (this.selectedId === id ? null : id);
        },

        copyToClipboard(text, msg) {
            navigator.clipboard.writeText(text);
            if (window.showToast) {
                window.showToast(msg, 'success');
            }
        },

        generateSnippet(ep, lang) {
            if (!ep || !ep.path) return '';
            const host = window.location.origin;
            const fullUrl = host + ep.path;
            if (lang === 'curl') {
                let cmd = `curl -X ${ep.method} "${fullUrl}"`;
                if (ep.headers) {
                    Object.entries(ep.headers).forEach(([k, v]) => {
                        cmd += ` \\\n  -H "${k}: ${v}"`;
                    });
                }
                if (ep.sample_request && ep.method !== 'GET') {
                    cmd += ` \\\n  -d '${JSON.stringify(ep.sample_request)}'`;
                }
                return cmd;
            } else if (lang === 'fetch') {
                const opts = { method: ep.method, headers: ep.headers || {} };
                if (ep.sample_request && ep.method !== 'GET') {
                    opts.body = ep.sample_request;
                }
                return `fetch("${fullUrl}", ${JSON.stringify(opts, null, 2)})\n  .then(res => res.json())\n  .then(data => console.log(data));`;
            } else if (lang === 'python') {
                let py = `import requests\n\nurl = "${fullUrl}"\n`;
                if (ep.headers) {
                    py += `headers = ${JSON.stringify(ep.headers, null, 2)}\n`;
                }
                if (ep.sample_request && ep.method !== 'GET') {
                    py += `payload = ${JSON.stringify(ep.sample_request, null, 2)}\n`;
                    py += `response = requests.${ep.method.toLowerCase()}(url, json=payload${ep.headers ? ', headers=headers' : ''})\n`;
                } else {
                    py += `response = requests.${ep.method.toLowerCase()}(url${ep.headers ? ', headers=headers' : ''})\n`;
                }
                py += `print(response.json())`;
                return py;
            }
            return '';
        },

        async runSandboxTest(epId) {
            const sb = this.sandboxState[epId];
            if (!sb) return;
            sb.loading = true;
            sb.result = null;
            const startTime = performance.now();
            try {
                let url = sb.path;
                if (sb.query) {
                    url += (url.includes('?') ? '&' : '?') + sb.query;
                }
                let reqHeaders = {};
                if (sb.headers) {
                    try { reqHeaders = JSON.parse(sb.headers); } catch(e) {}
                }
                const opts = {
                    method: sb.method,
                    headers: reqHeaders,
                };
                if (['POST', 'PUT', 'PATCH'].includes(sb.method) && sb.body) {
                    opts.body = sb.body;
                }
                const res = await fetch(url, opts);
                const endTime = performance.now();
                const duration = Math.round(endTime - startTime);
                let bodyText = await res.text();
                let jsonBody = null;
                try { jsonBody = JSON.parse(bodyText); } catch(e) {}
                sb.result = {
                    status: res.status,
                    statusText: res.statusText,
                    duration: duration,
                    headers: Array.from(res.headers.entries()),
                    bodyText: jsonBody ? JSON.stringify(jsonBody, null, 2) : bodyText
                };
            } catch (e) {
                sb.result = {
                    status: 0,
                    statusText: 'Network Error',
                    duration: 0,
                    headers: [],
                    bodyText: e.toString()
                };
            } finally {
                sb.loading = false;
            }
        }
    }));
});
</script>

<div x-data="apiDocsManager" class="!w-full !flex !flex-col !gap-6">

    <!-- Page Header & Action Bar -->
    <div class="!flex !flex-col sm:!flex-row sm:!items-center sm:!justify-between !gap-4 !w-full">
        <div class="!min-w-0">
            <h2 class="!text-[20px] !font-bold !text-gray-900 !tracking-tight !leading-tight">API Documentation & Testbed</h2>
            <p class="!text-[13px] !text-gray-500 !leading-tight !mt-0.5">Explore, test, and export TechLife REST API specifications</p>
        </div>

        <div class="!flex !items-center !gap-2 !shrink-0" x-data="{ openExport: false }">
            <div class="!relative">
                <c-ui.button type="button" variant="secondary" icon="download" label="Export Spec" @click="openExport = !openExport" />
                
                <div x-show="openExport" @click.outside="openExport = false" x-cloak
                     class="!absolute !right-0 !top-full !mt-2 !w-60 !bg-white !border !border-gray-100 !rounded-xl !shadow-xl !z-50 !p-1.5 !space-y-1">
                    <a href="{% url 'dashboard:api_export' %}?format=openapi" target="_blank" class="!flex !items-center !gap-2.5 !px-3 !py-2 !rounded-lg !text-[13px] !font-medium !text-gray-700 hover:!bg-blue-50 hover:!text-blue-700 !transition-colors">
                        <i data-lucide="file-json" class="!w-4 !h-4 !text-blue-600"></i> OpenAPI 3.0 (JSON)
                    </a>
                    <a href="{% url 'dashboard:api_export' %}?format=postman" target="_blank" class="!flex !items-center !gap-2.5 !px-3 !py-2 !rounded-lg !text-[13px] !font-medium !text-gray-700 hover:!bg-orange-50 hover:!text-orange-700 !transition-colors">
                        <i data-lucide="send" class="!w-4 !h-4 !text-orange-600"></i> Postman Collection
                    </a>
                    <a href="{% url 'dashboard:api_export' %}?format=markdown" target="_blank" class="!flex !items-center !gap-2.5 !px-3 !py-2 !rounded-lg !text-[13px] !font-medium !text-gray-700 hover:!bg-emerald-50 hover:!text-emerald-700 !transition-colors">
                        <i data-lucide="file-text" class="!w-4 !h-4 !text-emerald-600"></i> Markdown Reference
                    </a>
                </div>
            </div>

            <c-ui.button href="{% url 'dashboard:api_config' %}" variant="secondary" icon="key-round" label="Tokens & Config" />
        </div>
    </div>



    <!-- Search & Filters Toolbar Card -->
    <div class="!bg-white !rounded-xl !border !border-gray-200/80 !p-4" style="box-shadow: none;">
        <div class="!grid !grid-cols-1 md:!grid-cols-12 !gap-4 !w-full !items-end">
            <!-- Search Query Input -->
            <div class="md:!col-span-6">
                <c-ui.input name="searchQuery" label="Search Endpoints" placeholder="Search by name or path..." icon="search" x-model="searchQuery" />
            </div>

            <!-- Categories Dropdown Filter -->
            <div class="md:!col-span-3 !relative">
                <c-ui.select name="filterCategory" label="Category" x-model="filterCategory">
                    <option value="All">All Categories</option>
                    <option value="Blog Posts">Blog Posts</option>
                    <option value="Automation Ingestion">Automation Ingestion</option>
                    <option value="Interactions">Interactions</option>
                    <option value="Taxonomy">Taxonomy</option>
                    <option value="Curated Collections">Curated Collections</option>
                    <option value="Site Settings">Site Settings</option>
                </c-ui.select>
            </div>

            <!-- HTTP Methods Dropdown Filter -->
            <div class="md:!col-span-3 !relative">
                <c-ui.select name="filterMethod" label="HTTP Method" x-model="filterMethod">
                    <option value="All">All Methods</option>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="DELETE">DELETE</option>
                </c-ui.select>
            </div>
        </div>
    </div>

    <!-- Expandable Endpoint Catalogue List -->
    <div class="!flex !flex-col !gap-3 !w-full !min-w-0">
        <template x-for="ep in filteredEndpoints" :key="ep.id">
            <div class="!bg-white !rounded-xl !border !border-gray-200/80 !flex !flex-col" style="box-shadow: none;">
                
                <!-- Endpoint Card Header Bar (Click to Expand / Collapse) -->
                <button type="button" @click="toggleEndpoint(ep.id)"
                        class="!w-full !text-left !px-4 !py-3.5 !flex !flex-col sm:!flex-row sm:!items-center !justify-between !gap-3 hover:!bg-gray-50/80 !transition-colors !cursor-pointer !border-b !border-transparent !rounded-t-xl"
                        :class="selectedId === ep.id ? '!bg-blue-50/20 !border-gray-100' : '!rounded-b-xl !bg-white'">
                    
                    <div class="!flex !items-center !gap-3 !min-w-0 !flex-1">
                        <span :class="{
                            '!bg-emerald-50 !text-emerald-700 !border-emerald-200': ep.method === 'GET',
                            '!bg-blue-50 !text-blue-700 !border-blue-200': ep.method === 'POST',
                            '!bg-red-50 !text-red-700 !border-red-200': ep.method === 'DELETE'
                        }" class="!px-2.5 !py-1 !rounded-md !border !text-[11px] !font-bold !font-mono !shrink-0" x-text="ep.method"></span>

                        <div class="!min-w-0 !flex-1">
                            <div class="!flex !items-center !gap-2 !flex-wrap">
                                <h3 class="!text-[14px] !font-bold !text-gray-900 !truncate" x-text="ep.name"></h3>
                                <c-ui.badge variant="neutral" :label="ep.category" size="sm" />
                            </div>
                            <code class="!text-[12px] !font-mono !text-gray-500 !mt-0.5 !block !truncate" x-text="ep.path"></code>
                        </div>
                    </div>

                    <div class="!flex !items-center !gap-3 !shrink-0 !self-end sm:!self-center">
                        <c-ui.badge variant="info" :label="ep.auth_required" size="sm" />
                        <i data-lucide="chevron-down" class="!w-4 !h-4 !text-gray-400 !transition-transform !duration-200"
                           :class="selectedId === ep.id ? 'rotate-180 !text-blue-600' : ''"></i>
                    </div>
                </button>

                <!-- Expanded Content Panel -->
                <div x-show="selectedId === ep.id" x-collapse x-cloak class="!p-4 !flex !flex-col !gap-5 !bg-gray-50/40 !border-t !border-gray-100 !rounded-b-xl">

                    <!-- Description & Rules Box -->
                    <div class="!flex !flex-col !gap-3">
                        <p class="!text-[13px] !text-gray-700 !leading-relaxed" x-text="ep.description"></p>

                        <template x-if="ep.rules && ep.rules.length > 0">
                            <div class="!flex !items-start !gap-4 !p-5 !bg-amber-50 !rounded-xl !border-0">
                                <div class="!shrink-0 !p-2.5 !bg-amber-100/70 !text-amber-600 !rounded-lg">
                                    <i data-lucide="info" class="!w-4 !h-4"></i>
                                </div>
                                <div class="!flex !flex-col !gap-2 !min-w-0 !w-full">
                                    <h5 class="!text-[12px] !font-bold !text-amber-800 !uppercase !tracking-wider !mt-0.5">Rules & Constraints</h5>
                                    <ul class="!flex !flex-col !gap-2.5 !mt-1">
                                        <template x-for="rule in ep.rules">
                                            <li class="!flex !items-start !gap-2.5 !text-[12.5px] !text-amber-900/90 !leading-relaxed">
                                                <i data-lucide="check-circle-2" class="!w-4 !h-4 !text-amber-500 !shrink-0 !mt-[2px]"></i>
                                                <span x-text="rule"></span>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Path Parameters Table -->
                    <template x-if="ep.path_params && ep.path_params.length > 0">
                        <div class="!flex !flex-col !gap-2">
                            <h4 class="!text-[11px] !font-bold !text-gray-700 !uppercase !tracking-wider">Path Parameters</h4>
                            <c-ui.table extra_class="!shadow-none !border !border-gray-200">
                                <c-slot name="header">
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase">Parameter</th>
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase">Type</th>
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase !text-center !w-24">Required</th>
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase">Description</th>
                                </c-slot>
                                <c-slot name="body">
                                    <template x-for="pp in ep.path_params">
                                        <tr class="hover:!bg-gray-50 !transition-colors !border-b !border-gray-100 last:!border-0">
                                            <td class="!py-2.5 !px-4 !text-[12px] !font-mono !font-bold !text-blue-700" x-text="pp.name"></td>
                                            <td class="!py-2.5 !px-4 !text-[12px] !font-mono !text-gray-500" x-text="pp.type"></td>
                                            <td class="!py-2.5 !px-4 !text-center">
                                                <c-ui.badge variant="danger" label="Required" size="sm" />
                                            </td>
                                            <td class="!py-2.5 !px-4 !text-[12px] !text-gray-600" x-text="pp.description"></td>
                                        </tr>
                                    </template>
                                </c-slot>
                            </c-ui.table>
                        </div>
                    </template>

                    <!-- Request Body Input Fields Table -->
                    <template x-if="ep.body_params && ep.body_params.length > 0">
                        <div class="!flex !flex-col !gap-2">
                            <h4 class="!text-[11px] !font-bold !text-gray-700 !uppercase !tracking-wider">Request Body</h4>
                            <c-ui.table extra_class="!shadow-none !border !border-gray-200">
                                <c-slot name="header">
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase">Field Name</th>
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase">Type</th>
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase !text-center !w-24">Required</th>
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase">Description</th>
                                </c-slot>
                                <c-slot name="body">
                                    <template x-for="bp in ep.body_params">
                                        <tr class="hover:!bg-gray-50 !transition-colors !border-b !border-gray-100 last:!border-0">
                                            <td class="!py-2.5 !px-4 !text-[12px] !font-mono !font-bold !text-purple-700" x-text="bp.name"></td>
                                            <td class="!py-2.5 !px-4 !text-[12px] !font-mono !text-gray-500" x-text="bp.type"></td>
                                            <td class="!py-2.5 !px-4 !text-center">
                                                <template x-if="bp.required"><c-ui.badge variant="danger" label="Req" size="sm" /></template>
                                                <template x-if="!bp.required"><c-ui.badge variant="neutral" label="Opt" size="sm" /></template>
                                            </td>
                                            <td class="!py-2.5 !px-4 !text-[12px] !text-gray-600" x-text="bp.description"></td>
                                        </tr>
                                    </template>
                                </c-slot>
                            </c-ui.table>
                        </div>
                    </template>

                    <!-- Query Parameters Table -->
                    <template x-if="ep.query_params && ep.query_params.length > 0">
                        <div class="!flex !flex-col !gap-2">
                            <h4 class="!text-[11px] !font-bold !text-gray-700 !uppercase !tracking-wider">Query Parameters</h4>
                            <c-ui.table extra_class="!shadow-none !border !border-gray-200">
                                <c-slot name="header">
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase">Parameter</th>
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase">Type</th>
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase !text-center !w-24">Required</th>
                                    <th class="!py-2 !px-4 !text-[11px] !font-bold !text-gray-500 !uppercase">Description</th>
                                </c-slot>
                                <c-slot name="body">
                                    <template x-for="qp in ep.query_params">
                                        <tr class="hover:!bg-gray-50 !transition-colors !border-b !border-gray-100 last:!border-0">
                                            <td class="!py-2.5 !px-4 !text-[12px] !font-mono !font-bold !text-emerald-700" x-text="qp.name"></td>
                                            <td class="!py-2.5 !px-4 !text-[12px] !font-mono !text-gray-500" x-text="qp.type"></td>
                                            <td class="!py-2.5 !px-4 !text-center">
                                                <template x-if="qp.required"><c-ui.badge variant="danger" label="Req" size="sm" /></template>
                                                <template x-if="!qp.required"><c-ui.badge variant="neutral" label="Opt" size="sm" /></template>
                                            </td>
                                            <td class="!py-2.5 !px-4 !text-[12px] !text-gray-600" x-text="qp.description"></td>
                                        </tr>
                                    </template>
                                </c-slot>
                            </c-ui.table>
                        </div>
                    </template>

                    <!-- Code Snippets -->
                    <div class="!flex !flex-col !gap-3">
                        <div class="!flex !items-center !justify-between">
                            <h4 class="!text-[11px] !font-bold !text-gray-700 !uppercase !tracking-wider">Code Snippet</h4>
                            <c-ui.button type="button" variant="secondary" size="sm" icon="copy" label="Copy Code"
                                         @click="copyToClipboard(generateSnippet(ep, codeTabs[ep.id] || 'curl'), 'Code snippet copied!')" />
                        </div>

                        <div class="!flex !items-center !gap-2 !border-b !border-gray-200/80 !pb-1 !overflow-x-auto scrollbar-hide">
                            <button @click="codeTabs[ep.id] = 'curl'" :class="codeTabs[ep.id] === 'curl' ? '!text-blue-600 !border-blue-600' : '!text-gray-500 !border-transparent hover:!text-gray-700'" class="!px-3 !py-1 !text-[12px] !font-bold !border-b-2 !transition-colors !whitespace-nowrap !cursor-pointer">cURL</button>
                            <button @click="codeTabs[ep.id] = 'fetch'" :class="codeTabs[ep.id] === 'fetch' ? '!text-blue-600 !border-blue-600' : '!text-gray-500 !border-transparent hover:!text-gray-700'" class="!px-3 !py-1 !text-[12px] !font-bold !border-b-2 !transition-colors !whitespace-nowrap !cursor-pointer">JavaScript</button>
                            <button @click="codeTabs[ep.id] = 'python'" :class="codeTabs[ep.id] === 'python' ? '!text-blue-600 !border-blue-600' : '!text-gray-500 !border-transparent hover:!text-gray-700'" class="!px-3 !py-1 !text-[12px] !font-bold !border-b-2 !transition-colors !whitespace-nowrap !cursor-pointer">Python</button>
                        </div>

                        <div class="!bg-gray-50 !border !border-gray-200/80 !text-gray-800 !p-5 !rounded-xl !font-mono !text-[12.5px] !leading-relaxed !overflow-x-auto !w-full shadow-inner">
                            <pre x-text="generateSnippet(ep, codeTabs[ep.id] || 'curl')" class="!m-0"></pre>
                        </div>
                    </div>

                    <!-- Live Testbed -->
                    <div class="!pt-4 !border-t !border-gray-200 !flex !flex-col !gap-4">
                        <div class="!flex !items-center !gap-2">
                            <i data-lucide="play-circle" class="!w-4 !h-4 !text-emerald-600"></i>
                            <h4 class="!text-[11px] !font-bold !text-gray-900 !uppercase !tracking-wider">Interactive Testbed</h4>
                        </div>

                        <div class="!flex !flex-col md:!flex-row !gap-3 !items-end">
                            <div class="!w-full md:!w-40 !relative">
                                <c-ui.select name="sandboxMethod" label="Method" x-model="sandboxState[ep.id].method">
                                    <option value="GET">GET</option>
                                    <option value="POST">POST</option>
                                    <option value="DELETE">DELETE</option>
                                </c-ui.select>
                            </div>
                            <div class="!flex-1 !w-full">
                                <c-ui.input name="sandboxPath" label="Endpoint Path" x-model="sandboxState[ep.id].path" />
                            </div>
                        </div>

                        <template x-if="['POST', 'PUT', 'PATCH'].includes(sandboxState[ep.id].method)">
                            <div class="!w-full">
                                <c-ui.textarea name="sandboxBody" label="JSON Body Payload" rows="10" x-model="sandboxState[ep.id].body"></c-ui.textarea>
                            </div>
                        </template>

                        <div>
                            <c-ui.button type="button" variant="primary" icon="play" label="Execute Request" @click="runSandboxTest(ep.id)" />
                        </div>

                        <template x-if="sandboxState[ep.id].result">
                            <div class="!mt-2 !pt-4 !border-t !border-gray-100 !flex !flex-col !gap-2">
                                <div class="!flex !items-center !justify-between">
                                    <div class="!flex !items-center !gap-2">
                                        <c-ui.badge :variant="sandboxState[ep.id].result.status >= 200 && sandboxState[ep.id].result.status < 300 ? 'success' : 'danger'"
                                                    :label="'Status: ' + sandboxState[ep.id].result.status + ' ' + sandboxState[ep.id].result.statusText" size="sm" />
                                        <span class="!text-[11px] !font-mono !text-gray-500" x-text="sandboxState[ep.id].result.duration + ' ms'"></span>
                                    </div>
                                </div>

                                <div class="!bg-gray-50 !border !border-gray-200/80 !text-blue-900 !p-5 !rounded-xl !font-mono !text-[12.5px] !leading-relaxed !overflow-x-auto !max-h-[28rem] !w-full shadow-inner">
                                    <pre x-text="sandboxState[ep.id].result.bodyText" class="!m-0"></pre>
                                </div>
                            </div>
                        </template>
                    </div>

                </div>
            </div>
        </template>
    </div>

</div>
{% endblock %}
