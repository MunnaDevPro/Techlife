{% extends base_template %}

{% block content %}
<script id="api-endpoints-json" type="application/json">{{ endpoints_json|safe }}</script>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('apiDocsManager', () => ({
        endpoints: [],
        selectedId: 'posts_list',
        filterCategory: 'All',
        filterMethod: 'All',
        searchQuery: '',
        codeTab: 'curl',
        activeTab: 'overview',
        
        // Sandbox State
        customPath: '',
        customMethod: 'GET',
        customHeaders: '',
        customBody: '',
        customQuery: '',
        testLoading: false,
        testResult: null,
        copiedNotice: '',

        init() {
            try {
                const raw = document.getElementById('api-endpoints-json').textContent;
                this.endpoints = JSON.parse(raw);
                if (this.endpoints.length > 0) {
                    this.selectEndpoint(this.endpoints[0].id);
                }
            } catch (e) {
                console.error('Failed to parse API endpoints JSON:', e);
            }
        },

        get selectedEndpoint() {
            return this.endpoints.find(e => e.id === this.selectedId) || this.endpoints[0] || {};
        },

        get filteredEndpoints() {
            return this.endpoints.filter(e => {
                const matchesCat = this.filterCategory === 'All' || e.category === this.filterCategory;
                const matchesMethod = this.filterMethod === 'All' || e.method === this.filterMethod;
                const matchesSearch = !this.searchQuery || 
                    e.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                    e.path.toLowerCase().includes(this.searchQuery.toLowerCase());
                return matchesCat && matchesMethod && matchesSearch;
            });
        },

        selectEndpoint(id) {
            this.selectedId = id;
            const ep = this.selectedEndpoint;
            if (!ep) return;
            this.customPath = ep.path || '';
            this.customMethod = ep.method || 'GET';
            this.customHeaders = JSON.stringify(ep.headers || {}, null, 2);
            this.customBody = ep.sample_request ? JSON.stringify(ep.sample_request, null, 2) : '';
            this.customQuery = '';
            this.testResult = null;
        },

        copyToClipboard(text, msg) {
            navigator.clipboard.writeText(text);
            this.copiedNotice = msg;
            setTimeout(() => { this.copiedNotice = ''; }, 2500);
        },

        generateSnippet(ep, lang) {
            if (!ep || !ep.path) return '';
            const host = window.location.origin;
            const fullUrl = host + ep.path;
            if (lang === 'curl') {
                let cmd = `curl -X ${ep.method} "${fullUrl}"`;
                if (ep.headers) {
                    Object.entries(ep.headers).forEach(([k, v]) => {
                        cmd += ` \\\n  -H "${k}: ${v}"`;
                    });
                }
                if (ep.sample_request && ep.method !== 'GET') {
                    cmd += ` \\\n  -d '${JSON.stringify(ep.sample_request)}'`;
                }
                return cmd;
            } else if (lang === 'fetch') {
                const opts = { method: ep.method, headers: ep.headers || {} };
                if (ep.sample_request && ep.method !== 'GET') {
                    opts.body = ep.sample_request;
                }
                return `fetch("${fullUrl}", ${JSON.stringify(opts, null, 2)})\n  .then(res => res.json())\n  .then(data => console.log(data));`;
            } else if (lang === 'python') {
                let py = `import requests\n\nurl = "${fullUrl}"\n`;
                if (ep.headers) {
                    py += `headers = ${JSON.stringify(ep.headers, null, 2)}\n`;
                }
                if (ep.sample_request && ep.method !== 'GET') {
                    py += `payload = ${JSON.stringify(ep.sample_request, null, 2)}\n`;
                    py += `response = requests.${ep.method.toLowerCase()}(url, json=payload${ep.headers ? ', headers=headers' : ''})\n`;
                } else {
                    py += `response = requests.${ep.method.toLowerCase()}(url${ep.headers ? ', headers=headers' : ''})\n`;
                }
                py += `print(response.json())`;
                return py;
            }
            return '';
        },

        async runSandboxTest() {
            this.testLoading = true;
            this.testResult = null;
            const startTime = performance.now();
            try {
                let url = this.customPath;
                if (this.customQuery) {
                    url += (url.includes('?') ? '&' : '?') + this.customQuery;
                }
                let reqHeaders = {};
                if (this.customHeaders) {
                    try { reqHeaders = JSON.parse(this.customHeaders); } catch(e) {}
                }
                const opts = {
                    method: this.customMethod,
                    headers: reqHeaders,
                };
                if (['POST', 'PUT', 'PATCH'].includes(this.customMethod) && this.customBody) {
                    opts.body = this.customBody;
                }
                const res = await fetch(url, opts);
                const endTime = performance.now();
                const duration = Math.round(endTime - startTime);
                let bodyText = await res.text();
                let jsonBody = null;
                try { jsonBody = JSON.parse(bodyText); } catch(e) {}
                this.testResult = {
                    status: res.status,
                    statusText: res.statusText,
                    duration: duration,
                    headers: Array.from(res.headers.entries()),
                    bodyText: jsonBody ? JSON.stringify(jsonBody, null, 2) : bodyText
                };
            } catch (e) {
                this.testResult = {
                    status: 0,
                    statusText: 'Network Error',
                    duration: 0,
                    headers: [],
                    bodyText: e.toString()
                };
            } finally {
                this.testLoading = false;
            }
        }
    }));
});
</script>

<div x-data="apiDocsManager" class="!flex !flex-col !gap-6">

    <!-- Header Section -->
    <div class="!flex !flex-col sm:!flex-row sm:!items-center sm:!justify-between !gap-4">
        <div>
            <div class="!flex !items-center !gap-3 !mb-1">
                <div class="!w-10 !h-10 !rounded-xl !bg-gradient-to-br !from-blue-600 !to-indigo-700 !flex !items-center !justify-center !shadow-md">
                    <i data-lucide="book-open" class="!w-5 !h-5 !text-white"></i>
                </div>
                <h2 class="!text-2xl !font-bold !text-gray-900 !tracking-tight">API Documentation & Testbed</h2>
            </div>
            <p class="!text-[14px] !text-gray-500 !ml-[52px]">Explore, test, and export TechLife REST API specifications</p>
        </div>

        <!-- Export Spec Dropdown -->
        <div class="!flex !items-center !gap-2" x-data="{ openExport: false }">
            <div class="!relative">
                <button type="button" @click="openExport = !openExport" class="!inline-flex !items-center !gap-2 !rounded-xl !bg-white !border !border-gray-200 !text-gray-700 !font-bold !text-[13.5px] hover:!bg-gray-50 !transition-all !px-4 !py-2.5 !shadow-sm">
                    <i data-lucide="download" class="!w-4 !h-4 !text-blue-600"></i> Export Spec
                    <i data-lucide="chevron-down" class="!w-3.5 !h-3.5 !text-gray-400"></i>
                </button>
                <div x-show="openExport" @click.outside="openExport = false" x-cloak
                     class="!absolute !right-0 !top-full !mt-2 !w-56 !bg-white !border !border-gray-200 !rounded-xl !shadow-xl !z-50 !p-1.5">
                    <a href="{% url 'dashboard:api_export' %}?format=openapi" target="_blank" class="!flex !items-center !gap-2.5 !px-3 !py-2 !rounded-lg !text-[13px] !font-medium !text-gray-700 hover:!bg-blue-50 hover:!text-blue-700">
                        <i data-lucide="file-json" class="!w-4 !h-4 !text-blue-600"></i> OpenAPI 3.0 (JSON)
                    </a>
                    <a href="{% url 'dashboard:api_export' %}?format=postman" target="_blank" class="!flex !items-center !gap-2.5 !px-3 !py-2 !rounded-lg !text-[13px] !font-medium !text-gray-700 hover:!bg-orange-50 hover:!text-orange-700">
                        <i data-lucide="send" class="!w-4 !h-4 !text-orange-600"></i> Postman Collection
                    </a>
                    <a href="{% url 'dashboard:api_export' %}?format=markdown" target="_blank" class="!flex !items-center !gap-2.5 !px-3 !py-2 !rounded-lg !text-[13px] !font-medium !text-gray-700 hover:!bg-emerald-50 hover:!text-emerald-700">
                        <i data-lucide="file-text" class="!w-4 !h-4 !text-emerald-600"></i> Markdown Reference
                    </a>
                </div>
            </div>

            <a href="{% url 'dashboard:api_config' %}" class="!inline-flex !items-center !gap-2 !rounded-xl !bg-purple-50 !border !border-purple-200 !text-purple-700 !font-bold !text-[13.5px] hover:!bg-purple-100 !transition-all !px-4 !py-2.5">
                <i data-lucide="key-round" class="!w-4 !h-4 !text-purple-600"></i> Tokens & Config
            </a>
        </div>
    </div>

    <!-- Notification Toast -->
    <div x-show="copiedNotice" x-cloak x-transition
         class="!fixed !bottom-6 !right-6 !z-50 !bg-gray-900 !text-white !px-4 !py-3 !rounded-xl !shadow-2xl !flex !items-center !gap-3 !text-[13.5px] !font-medium">
        <i data-lucide="check-circle-2" class="!w-5 !h-5 !text-emerald-400"></i>
        <span x-text="copiedNotice"></span>
    </div>

    <!-- Main Grid Layout -->
    <div class="!grid !grid-cols-1 lg:!grid-cols-12 !gap-6">

        <!-- Sidebar Endpoint List -->
        <div class="lg:!col-span-4 !space-y-4">
            <c-ui.card padding="sm">
                <!-- Search & Filters -->
                <div class="!space-y-3">
                    <div class="!relative">
                        <i data-lucide="search" class="!w-4 !h-4 !text-gray-400 !absolute !left-3 !top-3"></i>
                        <input type="text" x-model="searchQuery" placeholder="Filter endpoints..."
                               class="!w-full !pl-9 !pr-3 !py-2 !text-[13px] !border !border-gray-200 !rounded-xl !bg-gray-50 focus:!bg-white focus:!border-blue-600 focus:!outline-none">
                    </div>

                    <div class="!flex !items-center !gap-2">
                        <select x-model="filterCategory" class="!flex-1 !px-2.5 !py-1.5 !text-[12px] !border !border-gray-200 !rounded-lg !bg-white !text-gray-700 focus:!outline-none">
                            <option value="All">All Categories</option>
                            <option value="Blog Posts">Blog Posts</option>
                            <option value="Automation Ingestion">Automation</option>
                            <option value="Interactions">Interactions</option>
                            <option value="Taxonomy">Taxonomy</option>
                            <option value="Site Config">Site Config</option>
                        </select>
                        <select x-model="filterMethod" class="!w-24 !px-2.5 !py-1.5 !text-[12px] !border !border-gray-200 !rounded-lg !bg-white !text-gray-700 focus:!outline-none">
                            <option value="All">All Methods</option>
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                            <option value="DELETE">DELETE</option>
                        </select>
                    </div>
                </div>

                <!-- List of Endpoints -->
                <div class="!mt-4 !space-y-1.5 !max-h-[580px] !overflow-y-auto !pr-1">
                    <template x-for="ep in filteredEndpoints" :key="ep.id">
                        <button type="button" @click="selectEndpoint(ep.id)"
                                :class="selectedId === ep.id ? '!bg-blue-50 !border-blue-200 !shadow-sm' : '!bg-white hover:!bg-gray-50 !border-gray-100'"
                                class="!w-full !text-left !p-3 !rounded-xl !border !transition-all !flex !flex-col !gap-1.5 !cursor-pointer">
                            <div class="!flex !items-center !justify-between !gap-2">
                                <span class="!font-bold !text-[13px] !text-gray-900 !truncate" x-text="ep.name"></span>
                                <span :class="{
                                    '!bg-emerald-50 !text-emerald-700 !border-emerald-200': ep.method === 'GET',
                                    '!bg-blue-50 !text-blue-700 !border-blue-200': ep.method === 'POST',
                                    '!bg-rose-50 !text-rose-700 !border-rose-200': ep.method === 'DELETE'
                                }" class="!px-2 !py-0.5 !rounded-md !border !text-[10px] !font-bold !font-mono" x-text="ep.method"></span>
                            </div>
                            <code class="!text-[11.5px] !font-mono !text-gray-500 !truncate" x-text="ep.path"></code>
                        </button>
                    </template>
                </div>
            </c-ui.card>
        </div>

        <!-- Main Workspace (Doc Details & Interactive Testbed) -->
        <div class="lg:!col-span-8">
            <template x-if="selectedEndpoint">
                <div class="!space-y-6">

                    <!-- Endpoint Header Banner -->
                    <c-ui.card padding="lg">
                        <div class="!flex !items-center !gap-3 !mb-3">
                            <span :class="{
                                '!bg-emerald-100 !text-emerald-800': selectedEndpoint.method === 'GET',
                                '!bg-blue-100 !text-blue-800': selectedEndpoint.method === 'POST',
                                '!bg-rose-100 !text-rose-800': selectedEndpoint.method === 'DELETE'
                            }" class="!px-3 !py-1 !rounded-lg !text-[12px] !font-black !font-mono" x-text="selectedEndpoint.method"></span>

                            <code class="!text-[15px] !font-mono !font-bold !text-gray-900" x-text="selectedEndpoint.path"></code>

                            <span class="!ml-auto !text-[11px] !font-bold !px-2.5 !py-1 !rounded-full !bg-gray-100 !text-gray-600" x-text="selectedEndpoint.category"></span>
                        </div>

                        <h3 class="!text-xl !font-bold !text-gray-900 !mb-1" x-text="selectedEndpoint.name"></h3>
                        <p class="!text-[13.5px] !text-gray-600 !leading-relaxed" x-text="selectedEndpoint.description"></p>

                        <!-- Tab Navigation -->
                        <div class="!flex !items-center !gap-4 !mt-6 !border-b !border-gray-200">
                            <button type="button" @click="activeTab = 'overview'"
                                    :class="activeTab === 'overview' ? '!border-blue-600 !text-blue-600 !font-bold' : '!border-transparent !text-gray-500 hover:!text-gray-700'"
                                    class="!pb-2.5 !text-[13.5px] !border-b-2 !transition-all">Overview & Code Snippets</button>
                            <button type="button" @click="activeTab = 'sandbox'"
                                    :class="activeTab === 'sandbox' ? '!border-blue-600 !text-blue-600 !font-bold' : '!border-transparent !text-gray-500 hover:!text-gray-700'"
                                    class="!pb-2.5 !text-[13.5px] !border-b-2 !transition-all !flex !items-center !gap-1.5">
                                <i data-lucide="play-circle" class="!w-4 !h-4 !text-emerald-600"></i> Interactive Testbed
                            </button>
                        </div>
                    </c-ui.card>

                    <!-- TAB 1: OVERVIEW & SNIPPETS -->
                    <div x-show="activeTab === 'overview'" class="!space-y-6">

                        <!-- Authentication & Parameters Card -->
                        <c-ui.card title="Request Details" padding="lg">
                            <div class="!space-y-4">
                                <div class="!flex !items-center !justify-between !p-3 !rounded-xl !bg-gray-50 !border !border-gray-200">
                                    <span class="!text-[13px] !font-bold !text-gray-700">Authentication Required</span>
                                    <span class="!text-[12px] !font-bold !px-2.5 !py-1 !rounded-md !bg-purple-50 !text-purple-700 !border !border-purple-200" x-text="selectedEndpoint.auth_required"></span>
                                </div>

                                <template x-if="selectedEndpoint.query_params && selectedEndpoint.query_params.length > 0">
                                    <div>
                                        <h4 class="!text-[12.5px] !font-bold !text-gray-700 !uppercase !tracking-wider !mb-2">Query Parameters</h4>
                                        <div class="!border !border-gray-200 !rounded-xl !overflow-hidden">
                                            <table class="!w-full !text-left !text-[13px]">
                                                <thead class="!bg-gray-50 !text-gray-600 !font-bold !border-b">
                                                    <tr>
                                                        <th class="!p-2.5">Parameter</th>
                                                        <th class="!p-2.5">Type</th>
                                                        <th class="!p-2.5">Description</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="!divide-y !divide-gray-100">
                                                    <template x-for="qp in selectedEndpoint.query_params">
                                                        <tr>
                                                            <td class="!p-2.5 !font-mono !font-bold !text-blue-700" x-text="qp.name"></td>
                                                            <td class="!p-2.5 !font-mono !text-gray-500" x-text="qp.type"></td>
                                                            <td class="!p-2.5 !text-gray-600" x-text="qp.description"></td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </c-ui.card>

                        <!-- Code Snippet Generator Card -->
                        <c-ui.card title="Code Snippet Generator" padding="lg">
                            <div class="!space-y-3">
                                <div class="!flex !items-center !justify-between">
                                    <div class="!flex !items-center !gap-2">
                                        <button type="button" @click="codeTab = 'curl'" :class="codeTab === 'curl' ? '!bg-gray-900 !text-white' : '!bg-gray-100 !text-gray-700'" class="!px-3 !py-1.5 !rounded-lg !text-[12px] !font-bold">cURL</button>
                                        <button type="button" @click="codeTab = 'fetch'" :class="codeTab === 'fetch' ? '!bg-gray-900 !text-white' : '!bg-gray-100 !text-gray-700'" class="!px-3 !py-1.5 !rounded-lg !text-[12px] !font-bold">JavaScript (fetch)</button>
                                        <button type="button" @click="codeTab = 'python'" :class="codeTab === 'python' ? '!bg-gray-900 !text-white' : '!bg-gray-100 !text-gray-700'" class="!px-3 !py-1.5 !rounded-lg !text-[12px] !font-bold">Python (requests)</button>
                                    </div>
                                    <button type="button" @click="copyToClipboard(generateSnippet(selectedEndpoint, codeTab), 'Code snippet copied!')" class="!text-[12px] !font-bold !text-blue-600 hover:!text-blue-800">
                                        Copy Code
                                    </button>
                                </div>

                                <div class="!bg-gray-900 !text-gray-100 !p-4 !rounded-xl !font-mono !text-[12.5px] !overflow-x-auto">
                                    <pre x-text="generateSnippet(selectedEndpoint, codeTab)"></pre>
                                </div>
                            </div>
                        </c-ui.card>
                    </div>

                    <!-- TAB 2: INTERACTIVE SANDBOX -->
                    <div x-show="activeTab === 'sandbox'" class="!space-y-6">
                        <c-ui.card title="Live API Testbed" subtitle="Execute live HTTP requests against local backend endpoints" padding="lg">
                            <div class="!space-y-4">
                                <div class="!grid !grid-cols-12 !gap-3">
                                    <div class="!col-span-3">
                                        <label class="!block !text-[12px] !font-bold !text-gray-700 !mb-1">Method</label>
                                        <select x-model="customMethod" class="!w-full !p-2.5 !text-[13px] !font-mono !font-bold !border !border-gray-200 !rounded-xl !bg-white">
                                            <option value="GET">GET</option>
                                            <option value="POST">POST</option>
                                            <option value="DELETE">DELETE</option>
                                        </select>
                                    </div>
                                    <div class="!col-span-9">
                                        <label class="!block !text-[12px] !font-bold !text-gray-700 !mb-1">Endpoint Path</label>
                                        <input type="text" x-model="customPath" class="!w-full !p-2.5 !text-[13px] !font-mono !border !border-gray-200 !rounded-xl !bg-gray-50">
                                    </div>
                                </div>

                                <div>
                                    <label class="!block !text-[12px] !font-bold !text-gray-700 !mb-1">Headers (JSON)</label>
                                    <textarea x-model="customHeaders" rows="3" class="!w-full !p-2.5 !text-[12.5px] !font-mono !border !border-gray-200 !rounded-xl !bg-gray-900 !text-gray-100"></textarea>
                                </div>

                                <template x-if="['POST', 'PUT', 'PATCH'].includes(customMethod)">
                                    <div>
                                        <label class="!block !text-[12px] !font-bold !text-gray-700 !mb-1">Request Body (JSON)</label>
                                        <textarea x-model="customBody" rows="5" class="!w-full !p-2.5 !text-[12.5px] !font-mono !border !border-gray-200 !rounded-xl !bg-gray-900 !text-gray-100"></textarea>
                                    </div>
                                </template>

                                <div class="!pt-2">
                                    <button type="button" @click="runSandboxTest()" :disabled="testLoading"
                                            class="!w-full !py-3 !rounded-xl !bg-blue-600 hover:!bg-blue-700 !text-white !font-bold !text-[14px] !transition-all !shadow-md !flex !items-center !justify-center !gap-2 !cursor-pointer">
                                        <i data-lucide="play" class="!w-4 !h-4"></i> Send Test Request
                                    </button>
                                </div>

                                <!-- Response Output -->
                                <template x-if="testResult">
                                    <div class="!mt-6 !pt-6 !border-t !border-gray-200 !space-y-3">
                                        <div class="!flex !items-center !justify-between">
                                            <div class="!flex !items-center !gap-2">
                                                <span :class="testResult.status >= 200 && testResult.status < 300 ? '!bg-emerald-100 !text-emerald-800' : '!bg-rose-100 !text-rose-800'"
                                                      class="!px-3 !py-1 !rounded-md !font-mono !font-bold !text-[12px]" x-text="'Status: ' + testResult.status + ' ' + testResult.statusText"></span>
                                                <span class="!text-[12px] !font-mono !text-gray-500" x-text="testResult.duration + ' ms'"></span>
                                            </div>
                                        </div>

                                        <div class="!bg-gray-900 !text-emerald-400 !p-4 !rounded-xl !font-mono !text-[12.5px] !overflow-x-auto !max-h-96">
                                            <pre x-text="testResult.bodyText"></pre>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </c-ui.card>
                    </div>

                </div>
            </template>
        </div>

    </div>

</div>
{% endblock %}
