{% extends base_template %}
{% load static %}

{% block content %}
<div class="!max-w-4xl !mx-auto !p-6">
    <form method="post" action="{% url 'dashboard:notifications' %}">
        {% csrf_token %}
        <div class="!flex !items-center !justify-between !mb-6">
            <h2 class="!text-2xl !font-bold !text-gray-900">Notifications Center</h2>
            <div class="!flex !items-center !gap-3">
                <c-ui.badge variant="info" size="md" label="{{ notifications_list|length }} Notifications" />
                {% if notifications_list %}
                <c-ui.button variant="danger" size="sm" type="submit" name="action" value="delete" icon="trash-2" label="Delete Selected" />
                {% endif %}
            </div>
        </div>

        <c-ui.card padding="none" extra_class="!shadow-none !overflow-hidden">
            {% if notifications_list %}
                <div class="!divide-y !divide-gray-100">
                    <div class="!px-4 !py-3 !bg-gray-50/50 !border-b !border-gray-100 !flex !items-center !gap-4">
                        <input type="checkbox" id="selectAll" class="!w-4 !h-4 !text-blue-600 !bg-gray-100 !border-gray-300 !rounded focus:!ring-blue-500 !cursor-pointer">
                        <label for="selectAll" class="!text-xs !font-semibold !text-gray-600 !cursor-pointer uppercase tracking-wider">Select All</label>
                    </div>
                    {% for notification in notifications_list %}
                        <c-ui.notification_item :notification="notification" />
                    {% endfor %}
                </div>
            {% else %}
                <c-ui.empty-state icon="bell-off" title="All caught up!" description="You don't have any new notifications right now. Check back later." />
            {% endif %}
        </c-ui.card>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const selectAll = document.getElementById("selectAll");
        const checkboxes = document.querySelectorAll("input[name='notification_ids']");
        
        if (selectAll) {
            selectAll.addEventListener("change", function() {
                checkboxes.forEach(cb => {
                    cb.checked = selectAll.checked;
                });
            });
            
            checkboxes.forEach(cb => {
                cb.addEventListener("change", function() {
                    if (!this.checked) {
                        selectAll.checked = false;
                    } else {
                        const allChecked = Array.from(checkboxes).every(c => c.checked);
                        selectAll.checked = allChecked;
                    }
                });
            });
        }
    });
</script>
{% endblock %}
