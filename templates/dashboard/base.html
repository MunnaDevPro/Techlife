{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} — TechLife Admin</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (compiled output) -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}?v=1.7">
    <!-- FontAwesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"
        integrity="sha384-ujb1lRIkbPla_iAJ5g4hPLw75l2H4Y7yWtdLiVy3O/S3B367v7cTf2Gz5n2Kyl7C"
        crossorigin="anonymous"></script>
    <!-- Alpine.js Plugins -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- Chart.js (for analytics) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- CKEditor 5 Super Build (CDN) — used by post create/edit pages -->
    <script id="ckeditor5-cdn" src="https://cdn.ckeditor.com/ckeditor5/39.0.1/super-build/ckeditor.js"></script>
    <!-- Blog Editor (CKEditor 5 init, upload adapter, tag system) -->
    <script defer src="{% static 'js/blog_editor.js' %}?v=1.1"></script>

    <style>
        /* ── Design Tokens ─────────────────────────────────────────── */
        :root {
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;

            /* Surface */
            --surface: #ffffff;
            --surface-2: #f9fafb;
            --surface-3: #f3f4f6;
            --page-bg: #fbfcfd;

            /* Borders */
            --border: rgba(0, 0, 0, 0.07);
            --border-strong: rgba(0, 0, 0, 0.12);

            /* Text */
            --text: #111827;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --text-disabled: #9ca3af;

            /* Brand / Primary */
            --primary: #2187ed;
            --primary-light: #e3f1fe;
            --primary-dark: #1972cd;

            /* Accent (green) */
            --accent: #006A4E;
            --accent-light: #d1fae5;

            /* Danger */
            --danger: #F42A41;
            --danger-light: #fee2e2;

            /* Warning */
            --warning: #f59e0b;
            --warning-light: #fef3c7;

            /* Shadows */
            --shadow-sm: none;
            --shadow-md: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-dropdown: 0 4px 12px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);

            /* Radius */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --radius-xl: 12px;

            /* Sidebar widths */
            --sidebar-w: 220px;
            --sidebar-w-col: 56px;

            /* Ambient gradient colours (ultra low opacity) */
            --ambient-indigo: rgba(33, 135, 237, 0.04);
            --ambient-yellow: rgba(253, 224, 71, 0.05);
            --ambient-sky: rgba(56, 189, 248, 0.04);
            --ambient-purple: rgba(168, 85, 247, 0.04);
        }

        /* ── Reset / Base ──────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-family: var(--font-sans);
            font-size: 13px;
        }

        body {
            background: var(--page-bg);
            color: var(--text);
            min-height: 100vh;
        }

        [x-cloak] {
            display: none !important;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-thin {
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.15) transparent;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.25);
        }

        /* ── Page layout ───────────────────────────────────────────── */
        .ft-layout {
            display: flex;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* ── Ambient background blobs ──────────────────────────────── */
        .ft-ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .ft-ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
        }

        .ft-amb-indigo {
            background: var(--ambient-indigo);
            width: 500px;
            height: 500px;
            top: -80px;
            left: 5%;
        }

        .ft-amb-yellow {
            background: var(--ambient-yellow);
            width: 420px;
            height: 420px;
            top: -60px;
            right: 8%;
        }

        .ft-amb-sky {
            background: var(--ambient-sky);
            width: 520px;
            height: 520px;
            top: 35%;
            right: -80px;
        }

        .ft-amb-purple {
            background: var(--ambient-purple);
            width: 480px;
            height: 480px;
            bottom: -40px;
            left: 10%;
        }

        /* ── Sidebar ───────────────────────────────────────────────── */
        .ft-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 30;
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width 0.22s cubic-bezier(.4, 0, .2, 1);
            overflow: hidden;
        }

        .ft-sidebar.collapsed {
            width: var(--sidebar-w-col);
        }

        .ft-sidebar.collapsed span,
        .ft-sidebar.collapsed .lucide-chevron-down,
        .ft-sidebar.collapsed .ft-user-text,
        .ft-sidebar.collapsed .ft-nav-logout {
            display: none !important;
        }

        .ft-sidebar.collapsed .ft-sidebar-brand {
            padding: 0;
            justify-content: center;
        }

        .ft-sidebar.collapsed .ft-nav-item {
            justify-content: center;
            padding: 10px 0;
        }

        .ft-sidebar.collapsed .ft-nav-sub-item {
            display: none !important;
        }

        .ft-sidebar.collapsed .ft-tree-group {
            display: none !important;
        }

        .ft-sidebar-brand {
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 10px;
            overflow: hidden;
            white-space: nowrap;
        }

        .ft-sidebar-logo {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .ft-sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 8px 6px;
        }

        .ft-sidebar-nav::-webkit-scrollbar {
            width: 3px;
        }

        .ft-sidebar-nav::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 4px;
        }

        .ft-nav-section-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--text-disabled);
            padding: 10px 8px 4px;
            white-space: nowrap;
            overflow: hidden;
        }

        .ft-nav-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 8px;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all .15s;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            border: none;
            background: none;
            width: 100%;
        }

        .ft-nav-item:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .ft-nav-item.active {
            background: transparent;
            color: var(--primary) !important;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .ft-nav-item.active i,
        .ft-nav-item.active svg {
            color: var(--primary) !important;
        }

        .ft-nav-item i,
        .ft-nav-item svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* Tree structure container */
        .ft-tree-group {
            position: relative;
            margin-left: 20px;
            padding-left: 12px;
            border-left: 1px solid var(--border-strong);
        }

        .ft-nav-sub-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
        }

        .ft-nav-sub-item:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .ft-nav-sub-item.active {
            background: transparent;
            color: var(--primary) !important;
            font-weight: 700;
        }

        .ft-nav-sub-item.active::before {
            content: '';
            position: absolute;
            left: -13px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 16px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* ── Main content wrapper ──────────────────────────────────── */
        .ft-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin-left: 0;
            max-width: 100%;
            transition: margin-left 0.22s cubic-bezier(.4, 0, .2, 1);
            position: relative;
            z-index: 1;
            min-width: 0;
        }

        @media (min-width: 1024px) {
            .ft-main {
                margin-left: var(--sidebar-w);
                max-width: calc(100% - var(--sidebar-w));
            }
        }

        .ft-main.sidebar-collapsed {
            margin-left: var(--sidebar-w-col);
            max-width: calc(100% - var(--sidebar-w-col));
        }

        /* ── Topbar ────────────────────────────────────────────────── */
        .ft-topbar {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 20;
            flex-shrink: 0;
        }

        /* ── Card ──────────────────────────────────────────────────── */
        .ft-card {
            background: var(--surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            overflow: visible;
        }

        .ft-card-header {
            padding: 10px 12px 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ft-card-body {
            padding: 12px;
        }

        .ft-card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .ft-card-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ── Table ─────────────────────────────────────────────────── */
        .ft-table-wrap {
            overflow-x: auto;
            width: 100%;
        }

        .ft-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .ft-table thead tr {
            border-bottom: 1px solid var(--border);
        }

        .ft-table thead th {
            padding: 10px 14px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--text-muted);
            background: var(--surface-2);
            white-space: nowrap;
        }

        .ft-table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background .12s;
        }

        .ft-table tbody tr:last-child {
            border-bottom: none;
        }

        .ft-table tbody tr:hover {
            background: var(--surface-2);
        }

        .ft-table td {
            padding: 10px 14px;
            color: var(--text-secondary);
            vertical-align: middle;
        }

        .ft-table td:first-child {
            color: var(--text);
            font-weight: 500;
        }

        /* ── Buttons ───────────────────────────────────────────────── */
        .ft-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all .15s;
            white-space: nowrap;
            font-family: var(--font-sans);
        }

        .ft-btn i,
        .ft-btn svg {
            width: 14px;
            height: 14px;
        }

        .ft-btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .ft-btn-primary:hover {
            background: var(--primary-dark);
        }

        .ft-btn-secondary {
            background: var(--surface);
            color: var(--text-secondary);
            border: 1px solid var(--border-strong);
        }

        .ft-btn-secondary:hover {
            background: var(--surface-2);
        }

        .ft-btn-ghost {
            background: transparent;
            color: var(--text-muted);
        }

        .ft-btn-ghost:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .ft-btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .ft-btn-danger:hover {
            background: #dc2626;
        }

        .ft-btn-success {
            background: var(--accent);
            color: #fff;
        }

        .ft-btn-success:hover {
            background: #059669;
        }

        .ft-btn-sm {
            padding: 4px 10px;
            font-size: 12px;
            gap: 5px;
        }

        .ft-btn-sm i,
        .ft-btn-sm svg {
            width: 12px;
            height: 12px;
        }

        .ft-btn-lg {
            padding: 9px 20px;
            font-size: 14px;
        }

        .ft-btn-icon {
            padding: 6px;
        }

        .ft-btn-full {
            width: 100%;
            justify-content: center;
        }

        /* ── Inputs ────────────────────────────────────────────────── */
        .ft-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .ft-input {
            display: block;
            width: 100%;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-family: var(--font-sans);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .ft-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(33, 135, 237, .15);
        }

        .ft-input::placeholder {
            color: var(--text-disabled);
        }

        .ft-input-icon {
            padding-left: 36px;
        }

        .ft-input-wrap {
            position: relative;
        }

        .ft-input-icon-el {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-disabled);
            pointer-events: none;
            width: 14px;
            height: 14px;
        }

        .ft-help-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .ft-error-text {
            font-size: 11px;
            color: var(--danger);
            margin-top: 4px;
        }

        /* ── Badges ────────────────────────────────────────────────── */
        .ft-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 11px;
            font-weight: 600;
        }

        .ft-badge-neutral {
            background: #f3f4f6;
            color: #374151;
        }

        .ft-badge-primary {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .ft-badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .ft-badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .ft-badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .ft-badge-info {
            background: #dbeafe;
            color: #1e40af;
        }

        /* ── KPI Widget ────────────────────────────────────────────── */
        .ft-kpi {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .ft-kpi-icon {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .ft-kpi-icon i,
        .ft-kpi-icon svg {
            width: 14px;
            height: 14px;
        }

        /* ── Modal ─────────────────────────────────────────────────── */
        .ft-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .ft-modal {
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 460px;
            box-shadow: var(--shadow-dropdown);
        }

        .ft-modal-sm {
            max-width: 360px;
        }

        .ft-modal-lg {
            max-width: 640px;
        }

        /* ── Drawer ────────────────────────────────────────────────── */
        .ft-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 55;
            background: var(--surface);
            border-left: 1px solid var(--border);
            box-shadow: var(--shadow-dropdown);
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            transition: transform 0.22s cubic-bezier(.4, 0, .2, 1);
        }

        .ft-drawer-sm {
            width: 320px;
        }

        .ft-drawer-md {
            width: 480px;
        }

        .ft-drawer-lg {
            width: 640px;
        }

        /* ── Dropdown ──────────────────────────────────────────────── */
        .ft-dropdown {
            position: absolute;
            z-index: 40;
            min-width: 180px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-dropdown);
            padding: 4px;
            overflow: hidden;
        }

        .ft-dropdown-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background .1s;
        }

        .ft-dropdown-item:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .ft-dropdown-item.selected {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        /* ── Page content ──────────────────────────────────────────── */
        .ft-page {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            max-width: 100%;
        }

        .ft-page-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .ft-page-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ── Tabs ──────────────────────────────────────────────────── */
        .ft-tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .ft-tab {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all .15s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        .ft-tab:hover {
            color: var(--text);
        }

        .ft-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }

        /* ── Toast ─────────────────────────────────────────────────── */
        .ft-toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow-dropdown);
            font-size: 13px;
            font-weight: 500;
            pointer-events: auto;
            cursor: pointer;
            min-width: 260px;
            max-width: 360px;
        }

        /* ── Transitions ───────────────────────────────────────────── */
        .ft-slide-enter {
            animation: ft-slide-in 0.18s ease;
        }

        @keyframes ft-slide-in {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ck-editor__editable_inline {
            min-height: 420px;
        }
    </style>
</head>

<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <!-- ── Dashboard Layout ── -->
    <c-layout.shell page_title="{{ page_title }}" active_menu="{{ active_menu }}" active_submenu="{{ active_submenu }}" unread_notifications="{{ unread_notifications }}">
        <div id="main-content" class="!w-full !max-w-full !overflow-hidden">
            {% block content %}{% endblock %}
        </div>
    </c-layout.shell>

    <!-- ── Global Toast Notifications ── -->
    <div x-data="{
        toasts: [],
        addToast(msg, type) {
            const id = Date.now() + Math.random();
            this.toasts.push({ id, message: msg, type });
            this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
            setTimeout(() => this.removeToast(id), 5000);
        },
        removeToast(id) { this.toasts = this.toasts.filter(t => t.id !== id); }
    }" @new-toast.window="addToast($event.detail.message, $event.detail.type)"
        class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none w-full max-w-sm">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="true" 
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
                x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
                x-transition:leave="transition ease-in duration-200" 
                x-transition:leave-start="opacity-100 sm:scale-100"
                x-transition:leave-end="opacity-0 sm:scale-95" 
                class="pointer-events-auto flex w-full items-start gap-3 rounded-xl bg-white p-4 shadow-2xl ring-1 ring-black/5">
                
                <div class="shrink-0 pt-0.5">
                    <i x-show="toast.type==='success'" data-lucide="check-circle-2" class="w-5 h-5 text-emerald-500"></i>
                    <i x-show="toast.type==='error'" data-lucide="x-circle" class="w-5 h-5 text-red-500"></i>
                    <i x-show="toast.type==='warning'" data-lucide="alert-triangle" class="w-5 h-5 text-amber-500"></i>
                    <i x-show="toast.type==='info'" data-lucide="info" class="w-5 h-5 text-blue-500"></i>
                </div>
                
                <div class="flex-1 w-0">
                    <p class="text-[13.5px] font-bold text-gray-900" 
                       x-text="toast.type.charAt(0).toUpperCase() + toast.type.slice(1)"></p>
                    <p class="mt-1 text-[13px] text-gray-500 leading-relaxed" x-text="toast.message"></p>
                </div>
                
                <div class="ml-4 flex shrink-0">
                    <button @click="removeToast(toast.id)" type="button" class="inline-flex rounded-md bg-white text-gray-400 hover:text-gray-600 focus:outline-none transition-colors">
                        <span class="sr-only">Close</span>
                        <i data-lucide="x" class="h-4 w-4"></i>
                    </button>
                </div>
            </div>
        </template>
    </div>

    <!-- ── Global Confirm Modal (Compact Cotton Component) ── -->
    <div x-data="{
        message: '',
        onConfirmCb: null,
        init() {
            window.addEventListener('open-confirm-modal', e => {
                this.message = e.detail.message;
                this.onConfirmCb = () => { 
                    if (e.detail.onConfirm) e.detail.onConfirm(); 
                    $dispatch('close-modal', {id: 'global-confirm'}); 
                };
                $dispatch('open-modal', {id: 'global-confirm'});
            });
        }
    }">
        <c-ui.modal id="global-confirm" size="sm">
            <div class="!flex !gap-3 !items-start">
                <div class="!flex-shrink-0 !w-10 !h-10 !rounded-full !bg-amber-50 !flex !items-center !justify-center !text-amber-500">
                    <i data-lucide="alert-triangle" class="!w-5 !h-5"></i>
                </div>
                <div class="!flex !flex-col !pt-0.5">
                    <h3 class="!text-[14.5px] !font-bold !text-gray-900 !mb-1">Confirm Action</h3>
                    <p class="!text-[13px] !text-gray-500 !leading-relaxed" x-text="message"></p>
                </div>
            </div>
            
            <c-slot name="modal_footer">
                <div class="!w-full !flex !justify-end !gap-2 !m-0 !p-0">
                    <button type="button" @click="$dispatch('close-modal', {id: 'global-confirm'})" class="!px-4 !py-2 !bg-white !border !border-gray-200 !rounded-lg !text-[13px] !font-medium !text-gray-700 hover:!bg-gray-50 !transition-colors !shadow-sm !cursor-pointer">
                        Cancel
                    </button>
                    <button type="button" @click="onConfirmCb && onConfirmCb()" class="!px-4 !py-2 !bg-blue-600 hover:!bg-blue-700 !rounded-lg !text-[13px] !font-medium !text-white !transition-colors !shadow-sm !cursor-pointer">
                        Confirm
                    </button>
                </div>
            </c-slot>
        </c-ui.modal>
    </div>

    <!-- ── Django Messages → Toast ── -->
    {% if messages %}
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            {% for msg in messages %}
            {% if msg.tags == 'error' %}
            window.dispatchEvent(new CustomEvent('new-toast', { detail: { message: "{{ msg|escapejs }}", type: 'error' } }));
            {% elif msg.tags == 'warning' %}
            window.dispatchEvent(new CustomEvent('new-toast', { detail: { message: "{{ msg|escapejs }}", type: 'warning' } }));
            {% elif msg.tags == 'success' %}
            window.dispatchEvent(new CustomEvent('new-toast', { detail: { message: "{{ msg|escapejs }}", type: 'success' } }));
            {% else %}
            window.dispatchEvent(new CustomEvent('new-toast', { detail: { message: "{{ msg|escapejs }}", type: 'info' } }));
            {% endif %}
            {% endfor %}
        });
    </script>
    {% endif %}

    <!-- ── Lucide Icons Init ── -->
    <script>
        window.showToast = (message, type = 'info') =>
            window.dispatchEvent(new CustomEvent('new-toast', { detail: { message, type } }));
        window.confirmAction = (message, onConfirm) =>
            window.dispatchEvent(new CustomEvent('open-confirm-modal', { detail: { message, onConfirm } }));

        function initLucide() { if (window.lucide) lucide.createIcons(); }
        document.addEventListener('DOMContentLoaded', initLucide);
        document.addEventListener('htmx:afterSwap', (e) => {
            initLucide();
            if (window.Alpine) {
                Alpine.process(e.target);
            }
        });
        document.addEventListener('htmx:afterSettle', initLucide);
    </script>
</body>

</html>
