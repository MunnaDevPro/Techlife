{% extends base_template %}

{% block content %}
<div style="display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div>
            <h2 class="ft-page-title">Traffic Trend Overview</h2>
            <p class="ft-page-subtitle">Real, time-windowed aggregated views</p>
        </div>
        <form method="get" style="display:flex;align-items:center;gap:8px">
            <label class="ft-label" style="text-transform:none;margin:0;white-space:nowrap">Time Range:</label>
            <select name="days" onchange="this.form.submit()" class="ft-input" style="width:140px">
                <option value="7" {% if days == 7 %}selected{% endif %}>Last 7 Days</option>
                <option value="30" {% if days == 30 %}selected{% endif %}>Last 30 Days</option>
                <option value="90" {% if days == 90 %}selected{% endif %}>Last 90 Days</option>
            </select>
        </form>
    </div>

    <c-ui.card title="Daily Page Views">
        <canvas id="trafficChart" style="max-height:320px"></canvas>
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ctx = document.getElementById('trafficChart');
            if (!ctx) return;
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: {{ chart_labels|safe }},
                    datasets: [{
                        label: 'Page Views',
                        data: {{ chart_values|safe }},
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99,102,241,0.08)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#6366f1',
                        pointRadius: 3,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 10 } } },
                        y: { grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 10 } }, beginAtZero: true }
                    }
                }
            });
        });
        </script>
    </c-ui.card>
</div>
{% endblock %}
