{% extends base_template %}

{% block content %}
<div class="space-y-6">
    <!-- Top Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h2 class="text-lg font-bold text-gray-800">Traffic Trend Overview</h2>
            <p class="text-[12px] text-gray-500">Real, time-windowed aggregated views without baseline inflation offsets</p>
        </div>
        
        <!-- Range Select -->
        <form method="get" class="flex items-center gap-2">
            <span class="text-[12px] text-gray-500 font-medium whitespace-nowrap">Time Range:</span>
            <select name="days" onchange="this.form.submit()" class="px-3 py-1.5 bg-white border border-gray-200 rounded-md text-[14px] focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option value="7" {% if days == 7 %}selected{% endif %}>Last 7 Days</option>
                <option value="30" {% if days == 30 %}selected{% endif %}>Last 30 Days</option>
                <option value="90" {% if days == 90 %}selected{% endif %}>Last 90 Days</option>
            </select>
        </form>
    </div>

    <!-- Chart -->
    <div class="w-full">
        <c-charts.line_chart title="Daily views count" :labels="chart_labels" :values="chart_values" dataset_label="Page Views" />
    </div>
</div>
{% endblock %}
