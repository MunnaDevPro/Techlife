{% extends base_template %}

{% block content %}
<div class="flex flex-col gap-5">
    <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
            <h2 class="ft-page-title">Traffic Trend Overview</h2>
            <p class="ft-page-subtitle">Real, time-windowed aggregated views</p>
        </div>
        <form method="get" class="flex items-center gap-2">
            <span class="text-[12px] font-medium whitespace-nowrap" style="color:var(--text-secondary)">Time Range:</span>
            <c-ui.select name="days" onchange="this.form.submit()" extra_class="w-[140px]">
                <option value="7" {% if days == 7 %}selected{% endif %}>Last 7 Days</option>
                <option value="30" {% if days == 30 %}selected{% endif %}>Last 30 Days</option>
                <option value="90" {% if days == 90 %}selected{% endif %}>Last 90 Days</option>
            </c-ui.select>
        </form>
    </div>

    <c-ui.card title="Daily Page Views">
        <canvas id="trafficChart" class="max-h-[320px]"></canvas>
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ctx = document.getElementById('trafficChart');
            if (!ctx) return;
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: {{ chart_labels|safe }},
                    datasets: [{
                        label: 'Page Views',
                        data: {{ chart_values|safe }},
                        borderColor: '#2187ed',
                        backgroundColor: 'rgba(33,135,237,0.08)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#2187ed',
                        pointRadius: 3,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 10 } } },
                        y: { grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 10 } }, beginAtZero: true }
                    }
                }
            });
        });
        </script>
    </c-ui.card>
</div>
{% endblock %}
