{% extends base_template %}

{% block content %}
<div class="flex flex-col gap-5">
    <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
            <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Traffic & Engagement</h2>
            <p class="text-[14px] text-gray-500 mt-1">Monitor real-time website visitors and page view trends.</p>
        </div>
        <form id="timeframe-form" method="get" class="min-w-[180px]">
            <c-ui.select name="days" is_django_form="true">
                <select name="days" @change="$event.target.closest('form').submit()" class="w-full">
                    <option value="7" {% if days == '7' %}selected{% endif %}>Last 7 Days</option>
                    <option value="30" {% if days == '30' %}selected{% endif %}>Last 30 Days</option>
                    <option value="90" {% if days == '90' %}selected{% endif %}>Last 90 Days</option>
                </select>
            </c-ui.select>
        </form>
    </div>

    <c-ui.card title="Overall Traffic Overview" padding="sm" class="border-gray-200 shadow-sm" subtitle="Daily aggregated page views across all posts">
        <div class="!mt-3 relative w-full" style="height: 280px;">
            <canvas id="trafficChart" class="w-full h-full"></canvas>
            <script>
            document.addEventListener('DOMContentLoaded', function() {
                const canvas = document.getElementById('trafficChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // Create incredibly smooth premium gradient for the area under the line
                let gradient = ctx.createLinearGradient(0, 0, 0, 400);
                gradient.addColorStop(0, 'rgba(37, 99, 235, 0.25)'); // Vibrant Brand Blue
                gradient.addColorStop(1, 'rgba(37, 99, 235, 0.0)');

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: {{ chart_labels|safe }},
                        datasets: [{
                            label: 'Page Views',
                            data: {{ chart_values|safe }},
                            borderColor: '#2563eb', // Vibrant Brand Blue
                            backgroundColor: gradient,
                            borderWidth: 3,
                            tension: 0.45, // Super smooth curves
                            fill: true,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: '#2563eb',
                            pointBorderWidth: 2,
                            pointRadius: 0, // Hide points by default for a sleek look
                            pointHoverRadius: 6, // Reveal them on hover
                            pointHoverBackgroundColor: '#2563eb',
                            pointHoverBorderColor: '#ffffff',
                            pointHoverBorderWidth: 3,
                            hitRadius: 30, // Larger hit area for easier hovering
                        }]
                    },
                    options: {
                        responsive: true, 
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        plugins: { 
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(17, 24, 39, 0.95)',
                                titleColor: '#9ca3af',
                                titleFont: { size: 12, family: 'Inter, sans-serif' },
                                bodyColor: '#ffffff',
                                bodyFont: { size: 15, weight: 'bold', family: 'Inter, sans-serif' },
                                padding: 14,
                                cornerRadius: 10,
                                displayColors: false,
                                callbacks: {
                                    title: function(context) {
                                        return context[0].label;
                                    },
                                    label: function(context) {
                                        return context.parsed.y + ' Visitors';
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { 
                                grid: { display: false }, // Cleaner x-axis
                                ticks: { font: { size: 11, family: 'Inter, sans-serif' }, color: '#9ca3af', maxTicksLimit: 10 } 
                            },
                            y: { 
                                grid: { color: 'rgba(0,0,0,0.04)', drawBorder: false, borderDash: [5, 5] }, 
                                ticks: { font: { size: 11, family: 'Inter, sans-serif' }, color: '#9ca3af', padding: 10 }, 
                                beginAtZero: true,
                                border: { display: false },
                                grace: '5%'
                            }
                        }
                    }
                });
            });
            </script>
        </div>
    </c-ui.card>
</div>
{% endblock %}
