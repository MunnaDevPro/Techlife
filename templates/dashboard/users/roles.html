{% extends base_template %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div>
        <h2 class="text-lg font-bold text-gray-800">Security Groups & Roles</h2>
        <p class="text-[12px] text-gray-500">Configure authorization levels and group memberships</p>
    </div>

    <!-- Groups list card -->
    <c-ui.card title="Django Authentication Groups">
        <c-ui.table headers="['Role Group Name', 'Members Count', 'Status']">
            {% for g in groups %}
                <tr>
                    <td class="px-6 py-4 font-semibold text-gray-900">
                        <span class="inline-flex items-center px-2 py-0.5 rounded text-[13px] bg-blue-50 text-blue-700 border border-blue-100">
                            {{ g.name }}
                        </span>
                    </td>
                    <td class="px-6 py-4 font-medium text-gray-700">{{ g.user_count }} users assigned</td>
                    <td class="px-6 py-4">
                        <c-ui.badge type="success">Active</c-ui.badge>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3" class="px-6 py-4 text-center text-gray-500">No authorization groups found.</td>
                </tr>
            {% endfor %}
        </c-ui.table>
    </c-ui.card>
</div>
{% endblock %}
