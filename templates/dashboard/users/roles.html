{% extends base_template %}

{% block content %}
<div style="display:flex;flex-direction:column;gap:20px">
    <div>
        <h2 class="ft-page-title">Security Groups & Roles</h2>
        <p class="ft-page-subtitle">Configure authorization levels and group memberships</p>
    </div>

    <c-ui.card title="Django Authorization Groups">
        <c-ui.table :headers="['Role Group', 'Members', 'Status']">
            {% for g in groups %}
            <tr>
                <td>
                    <c-ui.badge variant="primary">{{ g.name }}</c-ui.badge>
                </td>
                <td style="color:var(--text-muted)">{{ g.user_count }} users assigned</td>
                <td><c-ui.badge variant="success" dot="true">Active</c-ui.badge></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" style="text-align:center;padding:32px;color:var(--text-muted)">
                    <i data-lucide="shield" style="width:28px;height:28px;margin:0 auto 8px;display:block;opacity:.4"></i>
                    No authorization groups found
                </td>
            </tr>
            {% endfor %}
        </c-ui.table>
    </c-ui.card>
</div>
{% endblock %}
