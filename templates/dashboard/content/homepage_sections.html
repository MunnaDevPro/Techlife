{% extends base_template %}

{% block content %}
<div class="space-y-6">
    <!-- Top Header -->
    <div>
        <h2 class="text-lg font-bold text-gray-800">Homepage Sections Configuration</h2>
        <p class="text-[12px] text-gray-500">Configure which category feeds each homepage section without editing code</p>
    </div>

    <!-- Section Configurations list -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        {% for cfg in configs %}
            <c-ui.card title="{{ cfg.get_section_key_display }}">
                <form method="post" action="{% url 'dashboard:content_homepage_sections' %}" class="space-y-4">
                    {% csrf_token %}
                    <input type="hidden" name="config_id" value="{{ cfg.id }}">
                    
                    <div>
                        <label class="block text-[12px] font-medium text-gray-700 mb-1">Section Title Heading</label>
                        <input type="text" name="title" value="{{ cfg.title }}" class="w-full px-3 py-1.5 bg-white border border-gray-200 rounded-md text-[14px] focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-[12px] font-medium text-gray-700 mb-1">Source Category</label>
                        <select name="category_id" class="w-full px-3 py-1.5 bg-white border border-gray-200 rounded-md text-[14px] focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <option value="">All Categories</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if cfg.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-[12px] font-medium text-gray-700 mb-1">Display Post Count</label>
                        <input type="number" name="post_count" value="{{ cfg.post_count }}" min="1" max="20" class="w-full px-3 py-1.5 bg-white border border-gray-200 rounded-md text-[14px] focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-[12px] font-medium text-gray-700 mb-1">Status</label>
                        <select name="is_active" class="w-full px-3 py-1.5 bg-white border border-gray-200 rounded-md text-[14px] focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <option value="true" {% if cfg.is_active %}selected{% endif %}>Active</option>
                            <option value="false" {% if not cfg.is_active %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>

                    <div class="flex justify-end pt-2">
                        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-[14px] font-medium transition-colors">
                            Update Section
                        </button>
                    </div>
                </form>
            </c-ui.card>
        {% empty %}
            <div class="col-span-2">
                <c-ui.empty_state icon="settings" title="No homepage configuration" description="No sections configured in the database." />
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
