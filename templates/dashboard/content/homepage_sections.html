{% extends base_template %}

{% block content %}
<div class="flex flex-col gap-5">
    <!-- Top Header -->
    <div>
        <h2 class="ft-page-title">Homepage Sections Configuration</h2>
        <p class="ft-page-subtitle">Configure which category feeds each homepage section without editing code</p>
    </div>

    <!-- Section Configurations list -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        {% for cfg in configs %}
            <c-ui.card title="{{ cfg.get_section_key_display }}">
                <form method="post" action="{% url 'dashboard:content_homepage_sections' %}" class="flex flex-col gap-4">
                    {% csrf_token %}
                    <input type="hidden" name="config_id" value="{{ cfg.id }}">
                    
                    <c-ui.input name="title" label="Section Title Heading" value="{{ cfg.title }}" required="true"></c-ui.input>

                    <c-ui.select name="category_id" label="Source Category">
                        <option value="">All Categories</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if cfg.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </c-ui.select>

                    <c-ui.input name="post_count" label="Display Post Count" type="number" value="{{ cfg.post_count }}" min="1" max="20" required="true"></c-ui.input>

                    <c-ui.select name="is_active" label="Status">
                        <option value="true" {% if cfg.is_active %}selected{% endif %}>Active</option>
                        <option value="false" {% if not cfg.is_active %}selected{% endif %}>Inactive</option>
                    </c-ui.select>

                    <div class="flex justify-end pt-2 border-t" style="border-color:var(--border)">
                        <c-ui.button type="submit" label="Update Section"></c-ui.button>
                    </div>
                </form>
            </c-ui.card>
        {% empty %}
            <div class="col-span-2">
                <c-ui.empty-state icon="settings" title="No homepage configuration" description="No sections configured in the database."></c-ui.empty-state>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
