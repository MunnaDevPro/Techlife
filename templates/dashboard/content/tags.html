{% extends base_template %}

{% block content %}
<div class="flex flex-col gap-5">
    <div>
        <h2 class="ft-page-title">Post Tags</h2>
        <p class="ft-page-subtitle">Manage tags assigned to blog posts</p>
    </div>

    <!-- Create Tag -->
    <c-ui.card title="Add New Tag">
        <form method="post" class="grid grid-cols-[1fr_auto] gap-2.5 items-end">
            {% csrf_token %}
            <input type="hidden" name="action" value="create">
            <c-ui.input name="name" label="Tag Name" placeholder="e.g. Technology" required="true" icon="hash"></c-ui.input>
            <c-ui.button type="submit" variant="primary" label="Add Tag" icon="plus"></c-ui.button>
        </form>
    </c-ui.card>

    <!-- Tags List -->
    <c-ui.card title="Existing Tags" subtitle="{{ tags|length }} tags">
        <c-ui.table :headers="['Name', 'Slug', 'Posts', 'Actions']">
            {% for tag in tags %}
            <tr>
                <td>
                    <c-ui.badge variant="info">#{{ tag.name }}</c-ui.badge>
                </td>
                <td>
                    <code class="text-[11px] px-1.5 py-0.5 rounded" style="background:var(--surface-3);color:var(--text-muted)">{{ tag.slug }}</code>
                </td>
                <td><c-ui.badge variant="neutral">{{ tag.post_count }}</c-ui.badge></td>
                <td>
                    <form action="{% url 'dashboard:content_tags' %}" method="post"
                          onsubmit="return confirm('Delete this tag?')" class="inline">
                        {% csrf_token %}
                        <input type="hidden" name="action" value="delete">
                        <input type="hidden" name="id" value="{{ tag.id }}">
                        <c-ui.button type="submit" variant="danger" size="sm" icon="trash-2" label="Delete"></c-ui.button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center py-8" style="color:var(--text-muted)">
                    <i data-lucide="hash" class="w-7 h-7 mx-auto mb-2 block opacity-40"></i>
                    No tags found
                </td>
            </tr>
            {% endfor %}
        </c-ui.table>
    </c-ui.card>
</div>
{% endblock %}
