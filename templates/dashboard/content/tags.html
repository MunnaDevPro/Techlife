{% extends base_template %}

{% block content %}
<div class="space-y-6">
    <!-- Top Header -->
    <div>
        <h2 class="text-lg font-bold text-gray-800">Post Tags</h2>
        <p class="text-[12px] text-gray-500">Manage tags assigned to blog posts</p>
    </div>

    <!-- Create Tag Form -->
    <c-ui.card title="Add New Tag">
        <form method="post" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            {% csrf_token %}
            <input type="hidden" name="action" value="create">
            <div class="md:col-span-2">
                <label class="block text-[12px] font-medium text-gray-700 mb-1">Tag Name</label>
                <input type="text" name="name" required class="w-full px-3 py-1.5 border border-gray-200 rounded-md text-[14px] focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>
            <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-[14px] font-medium h-[38px] transition-colors">
                Add Tag
            </button>
        </form>
    </c-ui.card>

    <!-- Tags List -->
    <c-ui.card title="Existing Tags">
        <c-ui.table headers="['Name', 'Slug', 'Posts Count', 'Actions']">
            {% for tag in tags %}
                <tr>
                    <td class="px-6 py-4 font-medium text-gray-900">
                        <span class="inline-flex items-center px-2 py-0.5 rounded text-[13px] bg-blue-50 text-blue-700 border border-blue-100">
                            #{{ tag.name }}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-gray-500">{{ tag.slug }}</td>
                    <td class="px-6 py-4">{{ tag.post_count }}</td>
                    <td class="px-6 py-4">
                        <form action="{% url 'dashboard:content_tags' %}" method="post" onsubmit="return confirm('Delete this tag?');">
                            {% csrf_token %}
                            <input type="hidden" name="action" value="delete">
                            <input type="hidden" name="id" value="{{ tag.id }}">
                            <button type="submit" class="text-red-600 hover:text-red-700 font-medium">Delete</button>
                        </form>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4" class="px-6 py-4 text-center text-gray-500">No tags found.</td>
                </tr>
            {% endfor %}
        </c-ui.table>
    </c-ui.card>
</div>
{% endblock %}
