{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4 sm:px-6 font-montserrat bg-white overflow-hidden">
    <!-- Big 404 Text with Image Mask Effect -->
    <h1 class="text-[80px] sm:text-[120px] md:text-[140px] leading-none font-black text-transparent bg-clip-text mb-1 sm:mb-2 drop-shadow-sm" style="font-family: 'Arial Black', Impact, sans-serif; background-image: url('{% static \'image/error.jpg\' %}'); background-size: cover; background-position: center; -webkit-text-fill-color: transparent; -webkit-background-clip: text;">
        404
    </h1>
    
    <!-- Title -->
    <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-black mb-2 sm:mb-3">
        Page Not Found
    </h2>
    
    <!-- Subtitle -->
    <p class="text-[13px] sm:text-[15px] text-gray-500 mb-6 sm:mb-8 font-normal max-w-sm sm:max-w-none mx-auto">
        Sorry, but the page you were trying to view does not exist.
    </p>
    
    <!-- Red Button -->
    <a href="/"
        class="inline-flex items-center justify-center gap-2 px-6 sm:px-8 py-3 sm:py-3.5 bg-[#cc0000] hover:bg-[#aa0000] text-white text-[12px] sm:text-[13px] font-bold uppercase tracking-wider transition-colors duration-200 shadow-sm rounded-sm">
        <i class="fa-solid fa-house"></i>
        go to homepage
    </a>
</div>
{% endblock content %}
