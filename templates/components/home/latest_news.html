{% load static %}

<!-- LATEST POST SECTION -->
<div class="max-w-7xl mx-auto px-4 my-6 font-inter">

    <!-- Section Header with Nav Controls -->
    <div class="border-b-2 border-gray-200 mb-5 relative flex items-center justify-between">
        <div class="inline-block pb-2 -mb-[2px]" style="border-bottom: 2px solid #1e3a6e;">
            <h2 class="text-lg font-extrabold uppercase tracking-tight text-zinc-900 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-xs inline-block" style="background-color: #1e3a6e;"></span>
                Latest Post
            </h2>
        </div>
        <div class="flex items-center gap-1.5 pb-2">
            <button class="w-7 h-7 border border-gray-200 hover:text-white rounded-xs flex items-center justify-center text-gray-500 transition-colors text-xs" style="hover:background-color: #1e3a6e;" aria-label="Previous posts">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button class="w-7 h-7 border border-gray-200 hover:text-white rounded-xs flex items-center justify-center text-gray-500 transition-colors text-xs" aria-label="Next posts">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- 3 Horizontal Column Cards Side-by-Side -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        {% for blog in latest_blogs|slice:"3" %}
        <div class="overflow-hidden flex flex-col group">
            <a href="{% url 'blog_details' blog.slug %}" class="block relative h-48 sm:h-52 overflow-hidden rounded-sm">
                {% if blog.featured_image %}
                <img src="{{ blog.featured_image.url }}" alt="{{ blog.title }}" class="w-full h-full object-cover group-hover:scale-[1.03] transition-transform duration-500" loading="lazy" />
                {% elif blog.featured_image_url %}
                <img src="{{ blog.featured_image_url }}" alt="{{ blog.title }}" class="w-full h-full object-cover group-hover:scale-[1.03] transition-transform duration-500" loading="lazy" />
                {% else %}
                <img src="{% static 'image/placeholder-5.png' %}" alt="{{ blog.title }}" class="w-full h-full object-cover" />
                {% endif %}
            </a>
            <div class="pt-3 flex flex-col flex-1">
                <div class="text-[11px] text-gray-500 font-medium mb-1.5 flex items-center gap-1.5">
                    <span class="font-bold" style="color: #1e3a6e;">By {{ blog.author.first_name|default:blog.author.email }}</span>
                    <span>•</span>
                    <span>{{ blog.created_at|date:"F d, Y" }}</span>
                </div>
                <a href="{% url 'blog_details' blog.slug %}" class="font-extrabold text-base text-zinc-900 group-hover:text-[#1e3a6e] transition-colors leading-snug line-clamp-3">
                    {{ blog.title }}
                </a>
            </div>
        </div>
        {% endfor %}
    </div>

</div>
